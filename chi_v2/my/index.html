<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My · CHI 2027</title>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/site.css">
<script src="../shared/data.js"></script>
<script src="../shared/awards-data.js"></script>
<style>
* { box-sizing: border-box; }
.my { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding: 44px 0 96px; }
.my h1 { margin: 0; font: 600 clamp(44px, 6vw, 72px)/1 var(--serif); letter-spacing: -.05em; }
.my-lede { margin: 14px 0 32px; max-width: 640px; color: var(--muted); font-size: 16px; line-height: 1.55; }
.my-stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--card); margin-bottom: 28px; }
.my-stats a { display: grid; gap: 4px; padding: 16px 18px; border-right: 1px solid var(--line); color: inherit; text-decoration: none; }
.my-stats a:last-child { border-right: 0; }
.my-stats a:hover { background: #fff; }
.my-stats b { font: 700 28px/1 var(--serif); letter-spacing: -.03em; }
.my-stats span { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

.next { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; margin-bottom: 44px; padding: 28px 32px; border-radius: 22px; color: var(--cream); background: radial-gradient(120% 140% at 0% 0%, var(--deep-2), var(--deep) 60%); }
.next small { display: block; margin-bottom: 10px; color: #9bb0a8; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.next .clock { display: block; color: var(--lime); font: 800 clamp(40px, 5vw, 60px)/1 var(--serif); letter-spacing: -.05em; }
.next h2 { margin: 10px 0 6px; font: 700 clamp(20px, 2.4vw, 28px)/1.15 var(--serif); letter-spacing: -.03em; }
.next h2 a { color: inherit; text-decoration: none; }
.next h2 a:hover { text-decoration: underline; text-underline-offset: 4px; }
.next p { margin: 0; color: #c8d3ce; }
.next .go { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 99px; color: var(--deep); background: var(--lime); font: 700 14px/1 var(--serif); text-decoration: none; white-space: nowrap; }
.next.is-empty { grid-template-columns: 1fr; }

.sec { margin-top: 44px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.sec-head h2 { margin: 0; font: 700 28px/1.1 var(--serif); letter-spacing: -.04em; }
.sec-head a { color: var(--accent); font-weight: 700; font-size: 14px; }
.day { margin-top: 22px; }
.day h3 { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.rows { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); background: var(--card); }
.row.is-clash { border-color: var(--rust); box-shadow: inset 4px 0 0 var(--rust); }
.row .t { font: 700 15px/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.row .t small { display: block; margin-top: 3px; color: var(--muted); font: 500 12px/1.2 var(--sans); }
.row .main a.title { color: var(--ink); font-weight: 600; font-size: 15.5px; text-decoration: none; }
.row .main a.title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 5px; color: var(--muted); font-size: 13px; }
.row .meta a { color: var(--accent); font-weight: 600; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.badge.program { color: var(--accent); background: var(--accent-soft); }
.badge.award { color: var(--rust); background: var(--rust-soft); }
.badge.clash { color: #fff; background: var(--rust); }
.remove { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: transparent; font: 600 13px/1 var(--sans); cursor: pointer; }
.remove:hover { color: var(--ink); border-color: var(--ink); }
.empty { padding: 26px 22px; border: 1px dashed #c7c6bf; color: var(--muted); background: transparent; line-height: 1.55; }
.empty a { color: var(--accent); font-weight: 700; }
.people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 18px; }
.person { display: grid; gap: 8px; padding: 18px; border: 1px solid var(--line); background: var(--card); }
.person h3 { margin: 0; font: 700 18px/1.2 var(--serif); letter-spacing: -.02em; }
.person h3 a { color: inherit; text-decoration: none; }
.person h3 a:hover { color: var(--accent); }
.person p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.person p b { color: var(--ink); font-weight: 600; }
.person .note { padding: 10px 12px; border-left: 3px solid var(--accent); background: #eef3f0; color: var(--ink); }
.person .remove { justify-self: start; }
.interests { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.interests span { padding: 8px 12px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; }
.interests span:first-child { color: var(--lime); background: var(--deep); border-color: var(--deep); }
@media (max-width: 760px) {
  .my { width: calc(100% - 32px); padding-top: 28px; }
  .my-stats { grid-template-columns: repeat(2, 1fr); }
  .my-stats a:nth-child(2) { border-right: 0; }
  .my-stats a:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .next { grid-template-columns: 1fr; padding: 24px; }
  .row { grid-template-columns: 1fr auto; }
  .row .t { grid-column: 1 / -1; }
}
</style>
</head>
<body data-page="my">
<script src="../shared/shell.js"></script>
<main class="my" id="main" tabindex="-1">
  <h1>My</h1>
  <p class="my-lede">Everything you planned or saved anywhere on the site — sessions from Program, award papers, papers and people — in one place. Changes here show up on every page.</p>
  <div id="app"></div>
</main>
<script>
(function () {
  'use strict';
  var STORE = window.CHIStore;
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var to24 = function (t) { if (/^\d{1,2}:\d{2}$/.test(t)) return t.padStart(5, '0'); var p = t.split(' '), hm = p[0].split(':').map(Number), h = hm[0]; if (p[1] === 'PM' && h !== 12) h += 12; if (p[1] === 'AM' && h === 12) h = 0; return String(h).padStart(2, '0') + ':' + String(hm[1]).padStart(2, '0'); };
  var dayLong = function (d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); };
  var dayShort = function (d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
  var mapLink = function (room) { return room ? '../map/?room=' + encodeURIComponent(room) : '../map/'; };
  var SESSIONS = {}; CHI.sessions.forEach(function (s) { SESSIONS[s.id] = s; });
  var PAPERS = {}; CHI.sessions.forEach(function (s) { s.contents.forEach(function (c) { PAPERS[c.id] = { paper: c, session: s }; }); });
  var AWARDS = {}; CHI_AWARDS.papers.forEach(function (p) { AWARDS[p.id] = p; });
  var titleCase = function (id) { return id.split('-').map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' '); };

  function planItems() {
    var items = [];
    STORE.read('plan').forEach(function (id) {
      var s = SESSIONS[id]; if (!s) return;
      items.push({ kind: 'program', key: id, date: s.date, start: to24(s.startTime), end: to24(s.endTime), timeLabel: s.startTime, endLabel: s.endTime,
        title: s.title, href: '../program/?session=' + encodeURIComponent(id), room: s.room, sub: s.category + ' · ' + s.contents.length + ' papers' });
    });
    STORE.read('awards').forEach(function (id) {
      var p = AWARDS[id]; if (!p) return;
      items.push({ kind: 'award', key: id, date: p.date || '9999', start: p.start || '99:99', end: p.end || '99:99', timeLabel: p.start || 'TBA', endLabel: p.end || '',
        title: p.title, href: '../awards/?day=' + p.day + '#paper-' + encodeURIComponent(id), room: p.room, sub: 'Best Paper · ' + p.session });
    });
    items.sort(function (a, b) { return (a.date + a.start).localeCompare(b.date + b.start); });
    items.forEach(function (a) {
      a.clash = items.some(function (b) { return b !== a && b.date === a.date && a.date !== '9999' && b.start < a.end && a.start < b.end; });
    });
    return items;
  }

  function render() {
    var plan = planItems();
    var papers = STORE.read('papers').filter(function (id) { return PAPERS[id]; });
    var people = STORE.read('people') || {};
    var peopleIds = Object.keys(people);
    var interests = STORE.interests();
    var now = CHI.now.date + CHI.now.time;
    var next = plan.filter(function (i) { return i.date + i.start >= now && i.date !== '9999'; })[0];
    var html = '';

    html += '<nav class="my-stats" aria-label="Summary">' +
      '<a href="#plan"><b>' + plan.filter(function (i) { return i.kind === 'program'; }).length + '</b><span>Sessions</span></a>' +
      '<a href="#plan"><b>' + plan.filter(function (i) { return i.kind === 'award'; }).length + '</b><span>Award papers</span></a>' +
      '<a href="#papers"><b>' + papers.length + '</b><span>Saved papers</span></a>' +
      '<a href="#people"><b>' + peopleIds.length + '</b><span>People</span></a></nav>';

    if (next) {
      html += '<section class="next" aria-label="Next in your plan"><div><small>Next in your plan · it is ' + esc(CHI.now.label) + '</small>' +
        '<span class="clock">' + esc(next.date === CHI.now.date ? next.timeLabel : dayShort(next.date) + ' · ' + next.timeLabel) + '</span>' +
        '<h2><a href="' + next.href + '">' + esc(next.title) + '</a></h2><p>' + esc(next.room ? CHI.roomLabel(next.room) : 'Room to be announced') + '</p></div>' +
        '<a class="go" href="' + mapLink(next.room) + '">Show on Map →</a></section>';
    } else {
      html += '<section class="next is-empty"><div><small>Next in your plan</small><h2>Nothing coming up yet.</h2><p>Add sessions from Program or award papers from Awards.</p></div></section>';
    }

    html += '<section class="sec" id="plan" aria-labelledby="plan-h"><div class="sec-head"><h2 id="plan-h">My plan</h2><a href="../program/">Browse Program →</a></div>';
    if (!plan.length) {
      html += '<p class="empty">Your plan is empty. Open a session in <a href="../program/">Program</a> and choose “Add to My plan”, or add papers from <a href="../awards/">Awards</a>.</p>';
    } else {
      var days = [];
      plan.forEach(function (i) { if (days.indexOf(i.date) < 0) days.push(i.date); });
      days.forEach(function (d) {
        html += '<div class="day"><h3>' + (d === '9999' ? 'Not scheduled yet' : esc(dayLong(d)) + (d === CHI.now.date ? ' · Today' : '')) + '</h3><ul class="rows">';
        plan.filter(function (i) { return i.date === d; }).forEach(function (i) {
          html += '<li class="row' + (i.clash ? ' is-clash' : '') + '"><span class="t">' + esc(i.timeLabel) + (i.endLabel ? '<small>to ' + esc(i.endLabel) + '</small>' : '') + '</span>' +
            '<div class="main"><a class="title" href="' + i.href + '">' + esc(i.title) + '</a><div class="meta">' +
            '<span class="badge ' + i.kind + '">' + (i.kind === 'program' ? 'Program' : 'Award') + '</span>' +
            (i.clash ? '<span class="badge clash">Overlaps another item</span>' : '') +
            '<span>' + esc(i.sub) + '</span>' +
            (i.room ? '<a href="' + mapLink(i.room) + '">' + esc(CHI.roomLabel(i.room)) + '</a>' : '<span>Room to be announced</span>') + '</div></div>' +
            '<button class="remove" type="button" data-remove="' + (i.kind === 'program' ? 'plan' : 'awards') + '" data-id="' + esc(i.key) + '" aria-label="Remove ' + esc(i.title) + ' from My plan">Remove</button></li>';
        });
        html += '</ul></div>';
      });
    }
    html += '</section>';

    html += '<section class="sec" id="papers" aria-labelledby="papers-h"><div class="sec-head"><h2 id="papers-h">Saved papers</h2><a href="../people/#recommendations">Find more in Recommendations →</a></div>';
    if (!papers.length) {
      html += '<p class="empty">No saved papers. Use “Save paper” inside a session in <a href="../program/">Program</a>.</p>';
    } else {
      html += '<ul class="rows" style="margin-top:18px">' + papers.map(function (id) {
        var x = PAPERS[id], s = x.session;
        return '<li class="row"><span class="t">' + esc(dayShort(s.date)) + '<small>' + esc(x.paper.startTime) + '</small></span>' +
          '<div class="main"><a class="title" href="../program/?session=' + encodeURIComponent(s.id) + '">' + esc(x.paper.title) + '</a><div class="meta"><span>' + esc(x.paper.authors.join(' · ')) + '</span><span>in ' + esc(s.title) + '</span>' +
          '<a href="' + mapLink(s.room) + '">' + esc(CHI.roomLabel(s.room)) + '</a></div></div>' +
          '<button class="remove" type="button" data-remove="papers" data-id="' + esc(id) + '" aria-label="Remove ' + esc(x.paper.title) + ' from saved papers">Remove</button></li>';
      }).join('') + '</ul>';
    }
    html += '</section>';

    html += '<section class="sec" id="people" aria-labelledby="people-h"><div class="sec-head"><h2 id="people-h">People</h2><a href="../people/">Explore People →</a></div>';
    if (!peopleIds.length) {
      html += '<p class="empty">No saved people. On <a href="../people/">People</a>, use “Save with intention” to keep why someone matters.</p>';
    } else {
      html += '<div class="people-grid">' + peopleIds.map(function (id) {
        var p = people[id] || {}, name = p.name || titleCase(id);
        return '<article class="person"><h3><a href="../people/?person=' + encodeURIComponent(id) + '">' + esc(name) + '</a></h3>' +
          (p.affiliation ? '<p>' + esc(p.affiliation) + '</p>' : '') +
          '<p><b>Intention:</b> ' + esc(p.intention || '—') + '</p><p><b>Noticed at:</b> ' + esc(p.context || '—') + '</p>' +
          (p.note ? '<p class="note">' + esc(p.note) + '</p>' : '') +
          '<button class="remove" type="button" data-remove="people" data-id="' + esc(id) + '" aria-label="Remove ' + esc(name) + ' from saved people">Remove</button></article>';
      }).join('') + '</div>';
    }
    html += '</section>';

    html += '<section class="sec" aria-labelledby="int-h"><div class="sec-head"><h2 id="int-h">Interests</h2><a href="../people/">Edit on People →</a></div>' +
      '<div class="interests">' + interests.map(function (i) { return '<span>' + esc(i) + '</span>'; }).join('') + '</div>' +
      '<p class="my-lede" style="margin-top:14px">The first one is your starting point. Program, People and Recommendations all use these.</p></section>';

    app.innerHTML = html;
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-remove]'); if (!b) return;
    var list = b.getAttribute('data-remove'), id = b.getAttribute('data-id');
    if (list === 'people') { var p = STORE.read('people') || {}; delete p[id]; STORE.write('people', p); }
    else STORE.write(list, STORE.read(list).filter(function (x) { return x !== id; }));
    window.CHIShell.toast('Removed.');
  });
  window.addEventListener('chi-store', render);
  window.addEventListener('storage', render);
  window.addEventListener('pageshow', render);
  render();
})();
</script>
</body>
</html>
