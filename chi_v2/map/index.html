<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map · CHI 2027</title>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/site.css">
<script src="../shared/data.js"></script>
<script src="../shared/awards-data.js"></script>
<style>
:root{
  --bg:var(--paper); --surface:var(--card); --surface-2:var(--soft); --ink-2:#444444; --line-2:#cccccc;
  --accent-ink:var(--accent);
  --quiet:#2b6f86; --quiet-soft:#dcebf0; --busy:#9a6a00; --busy-soft:#f7ecd0;
  --ok:#2c6a3f; --ok-soft:#e1eee4; --no:#a83a2c; --no-soft:#f7e2de; --unk:#7a5e00; --unk-soft:#f6efd6;
  --room:#fff; --corridor:var(--soft); --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--serif);letter-spacing:-.02em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius: 0}
.app{display:block;height:100vh;min-height:640px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid transparent;border-radius: 0;padding:9px 12px}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;outline:0;flex:1;background:transparent;font:inherit;color:inherit;min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius: 0;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius: 0;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.now-chip{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.screen{flex:1;min-height:0;overflow:hidden}
/* plan */
svg.plan{width:100%;height:100%;max-width:100%;max-height:100%;display:block}
.plan .bg{fill:var(--surface)}
.plan .corr{fill:var(--corridor)}
.plan .room{fill:var(--room);stroke:var(--line-2);stroke-width:1;cursor:pointer;transition:fill .15s}
.plan .room:hover,.plan .room:focus{fill:var(--surface-2);outline:none}
.plan .room:focus-visible{stroke:var(--accent);stroke-width:2}
.plan .room.busy{fill:url(#busy)}
.plan .room.quiet{fill:var(--quiet-soft);stroke:var(--quiet);stroke-width:1.5}
.plan .room.sel{fill:var(--lime);stroke:var(--ink);stroke-width:2.5}
.plan .lbl{font-size:8px;fill:var(--ink-2);pointer-events:none;font-weight:600}
.plan .lbl.sel{fill:var(--ink);font-weight:800}
.plan .sub{font-size:6.5px;fill:var(--busy);font-weight:700;pointer-events:none}
.plan .route{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:5 4;stroke-linecap:round}
.plan .fac circle{stroke:var(--surface);stroke-width:1.5}
.plan .fac.lift circle{fill:#3b6fd8}.plan .fac.wc circle{fill:#7a4fd6}.plan .fac.seat circle{fill:#6b7280}
.plan .fac path,.plan .fac rect.g{fill:#fff}
.plan .fac text{font-size:6.5px;fill:#fff;font-weight:800}
/* map view */
.mapview{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.mapview.open{grid-template-columns:minmax(0,1fr) 320px}
.mapview.open .panel{animation:slidein .18s ease-out}
@media (prefers-reduced-motion: reduce){.mapview.open .panel{animation:none}}
.nextchip{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 110px);background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:7px 14px 7px 10px;cursor:pointer;font-size:13.5px;color:var(--ink);text-align:left}
.nextchip:hover{border-color:var(--accent)}
.nextchip svg{width:16px;height:16px;color:var(--accent);flex:none}
.nextchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextchip em{font-style:normal;font-weight:800;color:var(--accent-ink);margin-right:4px}
.nextchip b{color:var(--muted)}
.canvas{position:relative}
.floorbar{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius: 0;box-shadow:var(--shadow);overflow:hidden}
.floorbar button{border:0;border-bottom:1px solid var(--line);background:transparent;width:48px;height:38px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2)}
.floorbar button:last-child{border-bottom:0}
.floorbar button:hover{background:var(--surface-2)}
.floorbar button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.floorbar button.aud{font-size:12px}
.floorbar .gap{display:block;height:6px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.layerbar{position:absolute;left:14px;bottom:14px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius: 0;box-shadow:var(--shadow);padding:5px}
.lyr{display:flex;align-items:center;gap:6px;height:36px;border:0;border-radius: 0;background:transparent;padding:0 10px 0 6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.lyr svg{width:22px;height:22px;flex:none}
.lyr:hover{background:var(--surface-2)}
.lyr[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.plan .dim{opacity:.3}
.plan .room.hit{stroke:var(--accent);stroke-width:2.5}
.plan .fac .ring{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.hits{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hit-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius: 0;background:var(--surface);padding:8px 10px;cursor:pointer}
.hit-row:hover{border-color:var(--line-2)}
.hit-row .ic svg{width:22px;height:22px;display:block}
.hit-row b{display:block;font-size:14px;color:var(--ink)}
.hit-row span span{font-size:12.5px;color:var(--muted)}
.floors{padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;background:var(--surface);border-right:1px solid var(--line)}
.floors .cap{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px 4px}
.floors button{border:1px solid var(--line);background:var(--surface);border-radius: 0;padding:8px 10px;cursor:pointer;text-align:left}
.floors button:hover{border-color:var(--line-2)}
.floors button b{display:block;font-size:15px}
.floors button span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.floors button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.floors button[aria-pressed="true"] span{color:var(--surface);opacity:.75}
.floors hr{border:0;border-top:1px dashed var(--line-2);margin:6px 0}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px 22px;gap:12px}
.center h1{margin:0;font-size:22px;letter-spacing:-.01em}
.center h1 span{font-weight:500;color:var(--muted);font-size:15px;margin-left:8px}
.canvas{flex:1;min-height:320px;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius: 0;box-shadow:var(--shadow);padding:60px 80px 66px 20px;display:flex;align-items:center;justify-content:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);padding:5px 12px 5px 8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.pill i{width:14px;height:14px;border-radius:50%;display:inline-block}
.pill[aria-pressed="false"]{opacity:.55}
.pill[aria-pressed="false"] i{filter:grayscale(1)}
/* detail panel */
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 24px;position:relative}
.panel h2{margin:0;font-size:22px;letter-spacing:-.015em;padding-right:36px}
.panel .meta{color:var(--muted);margin:4px 0 16px;font-size:14px}
.x{position:absolute;right:16px;top:18px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.x svg{width:14px;height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius: 0;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;width:100%}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:var(--surface-2);color:var(--ink);width:100%}
.btn svg{width:16px;height:16px}
.sec{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:14px}
.sec h3{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ses{display:flex;flex-direction:column;font-size:14px;padding:7px 8px;margin:0 -8px;border-radius: 0;color:inherit;text-decoration:none}
a.ses:hover{background:var(--surface-2)}
.ses small{display:block;color:var(--muted);font-size:12px}
.sday{margin:12px 0 2px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sday:first-of-type{margin-top:4px}
.srcline a{color:var(--accent);font-weight:600}
.ses .t{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.live{display:inline-block;font-size:10.5px;font-weight:800;background:var(--deep);color:var(--lime);border-radius: 0;padding:1px 6px;margin-left:6px;vertical-align:1px}
.cap-row{display:flex;align-items:center;gap:10px;font-size:14px}
.meter{flex:none;width:72px;height:6px;border-radius: 0;background:var(--surface-2);overflow:hidden}
.meter b{display:block;height:100%;background:var(--busy)}
.a11y{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.a11y li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.no{background:var(--no-soft);color:var(--no)}.tag.unk{background:var(--unk-soft);color:var(--unk)}
.srcline{font-size:12px;color:var(--muted);margin-top:8px}
.srcline a{color:inherit}
.rest{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius: 0;padding:10px 12px;width:100%;background:var(--surface);cursor:pointer;text-align:left}
.rest:hover{border-color:var(--line-2)}
.rest .ic{width:34px;height:34px;border-radius: 0;background:var(--quiet-soft);color:var(--quiet);display:grid;place-items:center;flex:none}
.rest .ic svg{width:18px;height:18px}
.rest b{display:block;font-size:14px;color:var(--ink)}.rest span{font-size:12.5px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:6px 0;font-size:14px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:12px;display:grid;place-items:center}
.empty{display:flex;flex-direction:column;gap:10px}
.empty h2{font-size:20px}
.empty p{margin:0 0 6px;color:var(--muted);font-size:14px}
.quick{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius: 0;padding:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.quick:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.quick .ic{width:34px;height:34px;border-radius: 0;display:grid;place-items:center;flex:none}
.quick .ic svg{width:18px;height:18px}
.quick b{display:block;font-size:14px;color:var(--ink)}.quick span{font-size:12.5px;color:var(--muted)}
/* schedule */
.schedview{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.schedview.open{grid-template-columns:minmax(0,1fr) 480px}
.schedview:not(.open) .cards{grid-template-columns:repeat(auto-fill,minmax(460px,1fr))}
.slist{overflow:auto}
.shead{position:sticky;top:0;z-index:1;background:var(--bg);padding:18px 22px 10px;display:flex;align-items:baseline;gap:10px}
.shead h1{margin:0;font-size:22px;letter-spacing:-.01em}
.shead span{color:var(--muted);font-size:14px}
.days{display:flex;gap:6px;padding:0 22px 12px;background:var(--bg);position:sticky;top:58px;z-index:1}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:default}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cards{display:grid;gap:8px;padding:0 22px 22px}
.card{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius: 0;padding:12px 16px;cursor:pointer}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .t{font-weight:700;font-size:15px}
.card .k{font-size:12.5px;color:var(--muted)}
.loc{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.loc b{display:flex;align-items:center;gap:6px}
.loc b svg{width:14px;height:14px;color:var(--accent);flex:none}
.loc .lm{color:var(--muted);font-size:12.5px}
.badge{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--unk);background:var(--busy-soft);border-radius:999px;padding:1px 8px}
.preview{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:22px;position:relative;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.preview{animation:none}}
.preview h2{padding-right:40px}
.preview h2{margin:0;font-size:22px;letter-spacing:-.01em}
.preview .meta{color:var(--muted);font-size:14px;margin:2px 0 12px}
.pvmap{border:1px solid var(--line);border-radius: 0;padding:10px;background:var(--surface)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fact{background:var(--surface-2);border-radius: 0;padding:10px 12px;font-size:13.5px}
.fact h3{margin:0 0 2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
/* list view */
.listview{height:100%;overflow:auto;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start;grid-auto-rows:max-content;align-items:start}
.fcol{background:var(--surface);border:1px solid var(--line);border-radius: 0;overflow:hidden}
.fcol h2{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.fcol h2 span{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.fcol ul{list-style:none;margin:0;padding:0}
.fcol li>*{display:flex;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 16px;gap:8px;font-size:14px}
.fcol li:last-child>*{border-bottom:0}
.fcol li button{cursor:pointer}
.fcol li button:hover{background:var(--surface-2)}
.fcol .m{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
.fcol .fa{color:var(--ink-2)}
/* search */
.results{height:100%;overflow:auto;padding:18px 22px}
.results h1{margin:0 0 10px;font-size:18px}
.results ul{list-style:none;margin:0;padding:0;max-width:860px;background:var(--surface);border:1px solid var(--line);border-radius: 0;overflow:hidden}
.results li button,.results li div{display:flex;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 16px;gap:10px}
.results li button{cursor:pointer}.results li button:hover{background:var(--surface-2)}
.results .m{margin-left:auto;color:var(--muted);font-size:13px}
.results .none{color:var(--muted)}
.results ul.intents{margin-bottom:12px;border-color:var(--line-2)}
.results .intent{align-items:center}
.results .intent .ic{width:28px;height:28px;flex:none}.results .intent .ic svg{width:28px;height:28px}
.results .intent b{display:block;font-size:14.5px}.results .intent span span{display:block;color:var(--muted);font-size:12.5px}
.results .intent .m{color:var(--accent-ink);font-weight:600}
.results .hint{color:var(--muted);font-size:13px;margin:0 0 8px}
.retback{align-self:flex-start;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:6px 14px;margin:0;cursor:pointer;box-shadow:var(--shadow)}
.retback:hover{border-color:var(--ink)}
.ropts{display:grid;gap:6px}
.ropts button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-radius: 0;background:var(--surface);padding:9px 12px;cursor:pointer;font:inherit}
.ropts button b{font-size:14px;color:var(--ink)}.ropts button span{font-size:12.5px;color:var(--muted)}
.ropts button[aria-checked="true"]{border-color:#3b6fd8;box-shadow:inset 0 0 0 1px #3b6fd8;background:color-mix(in srgb,#3b6fd8 6%,var(--surface))}

.canvas.picking svg,.canvas.picking .room{cursor:crosshair}
.canvas.picking .room:hover{fill:#e3ebfb;stroke:#3b6fd8}
.pickbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#3b6fd8;color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.pickbar button{border:0;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-weight:700;padding:4px 12px;cursor:pointer}
.back{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:0;margin:0 0 6px;cursor:pointer}
.back:hover{color:var(--ink)}
.fromsel{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.fromsel input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius: 0;padding:9px 11px}
.fromsel input:focus-visible{outline:2px solid #3b6fd8;outline-offset:1px}
.fromres{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.fromres button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius: 0;background:var(--surface);padding:9px 11px;cursor:pointer;font:inherit;text-align:left}
.fromres button:hover,.fromres button:focus-visible{border-color:#3b6fd8}
.fromres b{font-size:14px;color:var(--ink)}.fromres span{font-size:12.5px;color:var(--muted)}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scenes button{border:1px solid var(--line);border-radius: 0;background:var(--surface);padding:8px 10px;font:inherit;font-size:12.5px;line-height:1.3;color:var(--ink);text-align:left;cursor:pointer}
.scenes button:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.fromsel select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius: 0;padding:8px 10px}
.ft{display:grid;gap:0;border:1px solid var(--line);border-radius: 0;padding:4px 12px;margin-top:10px}
.ft>div{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px}
.ft>div+div{border-top:1px dashed var(--line-2)}
.ft span:not(.dot){color:var(--muted);font-size:12.5px}
.ft button{margin-left:auto;border:0;background:transparent;color:var(--accent-ink);font-weight:700;font-size:13px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.you{background:#3b6fd8}.dot.to{background:var(--accent)}
.flv{border:1px solid var(--line-2);background:var(--surface);border-radius: 0;font-size:11px;font-weight:700;padding:0 6px;margin-left:4px;cursor:pointer;color:var(--ink-2)}
.flv[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.floorbar .allbtn{display:grid;place-items:center;border-bottom:6px solid var(--surface-2)}
.floorbar .allbtn svg{width:18px;height:18px}
svg.ov{width:100%;height:auto;max-height:100%;display:block}
.ov .slab{cursor:pointer}
.ov .slab .top{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}

.ov .pinm{fill:var(--accent)}
.ov .trip{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.ov .walk{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.ov .lv{font-size:15px;font-weight:800;fill:var(--ink)}
.ov .ld{font-size:10px;fill:var(--muted)}
.tripbox{border:1px solid var(--line);border-radius: 0;padding:8px;background:var(--surface)}

.listview2{height:100%;overflow:auto;position:relative}
.lindex{position:sticky;top:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;background:var(--bg);border-bottom:1px solid var(--line)}
.lindex a{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius: 0;padding:6px 14px;min-width:84px}
.lindex a b{font-size:15px;color:var(--ink)}

  .mapview.open,.mapview{grid-template-columns:1fr}.panel{max-height:none}.canvas{min-height:0;flex-direction:column;align-items:stretch;padding:56px 70px 12px 12px}.layerbar{position:static;align-self:flex-start;flex-wrap:wrap;max-width:none;row-gap:4px;margin:10px 0 0;box-shadow:none}.nextchip{max-width:calc(100% - 28px)}svg.plan{height:auto}
  .mapview,.schedview{grid-template-columns:1fr;height:auto}.floors{flex-direction:row;flex-wrap:wrap}.panel,.preview{border-left:0;border-top:1px solid var(--line)}.screen{overflow:visible}.slist{overflow:visible}.topbar{flex-wrap:wrap}.now-chip{margin-left:0}}
</style>

<body data-page="map">
<script src="../shared/shell.js"></script>
<div class="app">
  <div class="main">
    <header class="topbar">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Search</span>
        <input id="q" type="search" placeholder="Search rooms, sessions, or needs — e.g. quiet, wheelchair" autocomplete="off"></label>
      <div class="seg" role="group" aria-label="View" id="viewseg">
        <button data-view="map" aria-pressed="true">Map</button>
        <button data-view="list" aria-pressed="false">List</button>
      </div>
      <span class="now-chip" id="nowChip"></span>
    </header>
    <main class="screen" id="main" tabindex="-1"></main>
  </div>
</div>

<script>
// ---------- shared site data (shared/data.js + shared/awards-data.js) ----------
const NOW = CHI.now.time, TODAY = CHI.now.date;
const STORE = window.CHIStore;
const to24 = t => { if (/^\d{1,2}:\d{2}$/.test(t)) return t.padStart(5,"0"); const [c,m]=t.split(" "); let [h,mi]=c.split(":").map(Number); if(m==="PM"&&h!==12) h+=12; if(m==="AM"&&h===12) h=0; return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0"); };
const dayShort = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"});
// Every event that happens in a room: Program sessions and award paper sessions.
const SCHED = {};
CHI.sessions.forEach(x=>(SCHED[x.room]=SCHED[x.room]||[]).push({date:x.date, start:to24(x.startTime), end:to24(x.endTime), title:x.title, kind:"Program", href:"../program/?session="+encodeURIComponent(x.id), sessionId:x.id}));
(function(){ const seen={}; CHI_AWARDS.papers.forEach(p=>{ if(!p.room||!p.date) return; const k=p.room+p.date+p.start; if(seen[k]){ seen[k].awards++; return; }
  const ev={date:p.date, start:p.start, end:p.end, title:p.session, kind:"Award session", href:"../awards/?day="+p.day+"#paper-"+p.id, awards:1}; seen[k]=ev; (SCHED[p.room]=SCHED[p.room]||[]).push(ev); }); })();
Object.values(SCHED).forEach(l=>l.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)));
function info(n){ const all=SCHED[n]||[]; return {cap: CHI.capacity[n] ?? null, all, sessions: all.filter(e=>e.date===TODAY).map(e=>[e.start,e.end,e.title,e])}; }
// The visitor's next planned item (Program plan + award papers added to their day), else the next session today.
function nextUp(){
  const plan=STORE.read("plan"), aw=STORE.read("awards"), items=[];
  CHI.sessions.forEach(x=>{ if(plan.includes(x.id)) items.push({date:x.date,start:to24(x.startTime),title:x.title,room:x.room,mine:true}); });
  CHI_AWARDS.papers.forEach(p=>{ if(aw.includes(p.id)&&p.room&&p.date) items.push({date:p.date,start:p.start,title:p.session,room:p.room,mine:true}); });
  const later=e=>(e.date>TODAY)||(e.date===TODAY&&e.start>=NOW);
  const mine=items.filter(later).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))[0];
  if (mine) return mine;
  const any=[]; Object.entries(SCHED).forEach(([room,l])=>l.forEach(e=>{ if(e.date===TODAY&&e.start>=NOW) any.push({...e,room}); }));
  return any.sort((a,b)=>a.start.localeCompare(b.start))[0] || null;
}
function nextLabel(n){ return (n.date!==TODAY?dayShort(n.date)+" "+n.start+" · ":"")+n.title+" · "+(ROOMS[n.room].floor==="AUD"?"Auditorium":ROOMS[n.room].floor+" · "+title(n.room)); }
const ICON = {
  pin:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>',
  route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>',
  leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 4C10 4 4 9 4 16c0 2 1 4 1 4s2-1 4-1c7 0 11-6 11-15z"/><path d="M5 20c4-6 8-9 12-11"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/></svg>',
  door:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21h16M6 21V4h9v17M15 4l4 2v15"/><circle cx="12" cy="13" r="1"/></svg>'
};

const LAYER_ICON = {
  quiet:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--quiet)"/><path d="M17 7c-6 0-9 3-9 7 0 1 .5 2 .5 2s1-.5 2-.5c4 0 6.5-3.5 6.5-8.5z" fill="#fff"/></svg>',
  lift:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#3b6fd8"/><path d="M8.5 10.5 12 6.5l3.5 4zM8.5 13.5l3.5 4 3.5-4z" fill="#fff"/></svg>',
  wc:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#7a4fd6"/><text x="12" y="15.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="sans-serif">WC</text></svg>',
  seat:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#6b7280"/><rect x="6.5" y="10" width="11" height="2.6" rx=".8" fill="#fff"/><rect x="7.5" y="12.6" width="1.6" height="4" fill="#fff"/><rect x="14.9" y="12.6" width="1.6" height="4" fill="#fff"/></svg>',
  busy:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--busy)"/><path d="M6.5 10h2.5l3-2.5v9L9 14H6.5z" fill="#fff"/><path d="M14.5 9.5a3.5 3.5 0 0 1 0 5M16.5 7.5a6.3 6.3 0 0 1 0 9" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>'
};

// ---------- floors ----------
const FLOORS = CHI.floors.map(f=>({...f, rooms:f.rooms.map(r=>({...r})), fac:f.fac.map(x=>({...x}))}));
const F = Object.fromEntries(FLOORS.map(f=>[f.id,f]));
const CORR = {y:136, h:28};
FLOORS.forEach(f=>f.fac.forEach(x=>{ x.y = CORR.y + CORR.h/2; }));
const ROOMS = {}; FLOORS.forEach(f=>f.rooms.forEach(r=>ROOMS[r.name]=r));

// ---------- helpers ----------
const S = {tab:"map", view:"map", floor:"ALL", sel:null, route:false, from:null, picking:false, find:null, q:"", ret:null, lift:null};
const screen = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isNum = r => /^\d|^M\d/.test(r.short);
function title(n){ return CHI.roomTitle(n); }
function where(n){ const r=ROOMS[n]; return r.floor==="AUD" ? "Auditorium · Separate building" : "Level "+r.floor; }
function nearLift(r){ const lifts=F[r.floor].fac.filter(x=>x.type==="lift"); if(!lifts.length) return null; const cx=r.x+r.w/2; return lifts.reduce((a,b)=>Math.abs(b.x-cx)<Math.abs(a.x-cx)?b:a); }
function landmark(r){ const l=nearLift(r); return l ? "Near "+l.label : ""; }
function capInfo(n){ const c=info(n).cap; if(c==null) return null; return {c, small:c<=80, pct:Math.min(100, Math.round(80/c*100))}; }

function planSVG(f, selName=S.sel, withRoute=false){
  const FD=(selName===S.sel)?S.find:null, sel=selName&&ROOMS[selName]&&ROOMS[selName].floor===f.id ? ROOMS[selName] : null;
  let s=`<svg class="plan" viewBox="0 0 360 270" role="group" aria-label="${esc(f.label)} floor plan">
  <defs><pattern id="busy" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--busy-soft)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--busy)" stroke-width="1.4" opacity=".55"/></pattern></defs>`;
  if (f.id!=="AUD") s+=`<rect class="corr" x="10" y="${CORR.y}" width="340" height="${CORR.h}" rx="4"/>`;
  [...f.rooms].sort((a,b)=>(a===sel)-(b===sel)).forEach(r=>{
    const hit = FD && ((FD==="quiet"&&r.quiet)||(FD==="busy"&&r.busy)); const dim = FD && !hit && r!==sel;
    const cls=["room", r===sel?"sel":"", r.quiet&&r!==sel?"quiet":"", r.busy&&r!==sel?"busy":"", hit?"hit":"", dim?"dim":""].join(" ");
    const label = title(r.name)+(r.busy?", busy and loud":"");
    s+=`<rect class="${cls}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.quiet?10:3}" tabindex="0" role="button" aria-label="${esc(label)}" data-room="${esc(r.name)}"/>`;
    const fs = r.w<26?7.5:(r.w<45?8.5:10); const tx=r.x+r.w/2, ty=r.y+r.h/2+3;
    s+=`<text class="lbl ${r===sel?"sel":""}" x="${tx}" y="${ty}" text-anchor="middle" style="font-size:${fs}px${r.quiet?";fill:var(--quiet)":""}${dim?";opacity:.35":""}">${esc(r.short)}</text>`;
    if (r.busy && !dim) s+=`<text class="sub" x="${tx}" y="${ty+11}" text-anchor="middle">BUSY · LOUD</text>`;
  });
  if (withRoute && S.from) s+=routeSVG(f);
  f.fac.forEach(x=>{ const fh=FD===x.type, fdm=FD&&!fh;
    const g = x.type==="lift" ? `<path d="M${x.x-2.6} ${x.y-1} l2.6 -3 l2.6 3z M${x.x-2.6} ${x.y+1} l2.6 3 l2.6 -3z"/>`
      : x.type==="wc" ? `<text x="${x.x}" y="${x.y+2.4}" text-anchor="middle">WC</text>`
      : `<rect class="g" x="${x.x-3.5}" y="${x.y-1}" width="7" height="2" rx=".5"/><rect class="g" x="${x.x-3}" y="${x.y+1}" width="1" height="2.5"/><rect class="g" x="${x.x+2}" y="${x.y+1}" width="1" height="2.5"/>`;
    s+=`<g class="fac ${x.type}${fdm?" dim":""}"><title>${esc(x.label)}</title>${fh?`<circle class="ring" cx="${x.x}" cy="${x.y}" r="12"/>`:""}<circle cx="${x.x}" cy="${x.y}" r="7"/>${g}</g>`; });
  if (withRoute && S.from) s+=youSVG(f);
  if (sel){ const cx=sel.x+sel.w/2, cy=sel.y-1; s+=`<g aria-hidden="true"><path d="M${cx} ${cy} l-7 -11 a8 8 0 1 1 14 0 z" fill="var(--ink)"/><circle cx="${cx}" cy="${cy-14}" r="3" fill="var(--lime)"/></g>`; }
  return s+"</svg>";
}


const FIND = {
  quiet:{short:"Quiet", title:"Quiet room", note:"A calm space to take a break."},
  lift:{short:"Elevator", title:"Elevators", note:"Step-free access between levels."},
  wc:{short:"Restroom", title:"Accessible restrooms", note:"Every restroom has a wheelchair-accessible stall."},
  seat:{short:"Seating", title:"Seating", note:"Places to sit and rest along the corridors."},
  busy:{short:"Busy", title:"Busy & loud areas", note:"Crowded and noisy — you may want to avoid these at peak times."}
};
function lvl(id){ return id==="AUD" ? "Auditorium" : "Level "+id; }
function facNear(f,x){ const rs=f.rooms.filter(r=>!r.quiet); if(!rs.length) return ""; const r=rs.reduce((a,b)=>Math.abs(b.x+b.w/2-x.x)<Math.abs(a.x+a.w/2-x.x)?b:a); return "Near "+title(r.name); }
function findItems(k){
  const out=[];
  FLOORS.forEach(f=>{
    if (k==="quiet"||k==="busy") f.rooms.filter(r=>k==="quiet"?r.quiet:r.busy).forEach(r=>out.push({floor:f.id, name:title(r.name), meta:landmark(r), room:r.name}));
    else f.fac.filter(x=>x.type===k).forEach(x=>out.push({floor:f.id, name:x.type==="lift"?x.label:FIND[k].title.replace(/s$/,""), meta:x.type==="lift"?"":facNear(f,x)}));
  });
  return out;
}
function setFind(k){
  if (S.find===k){ S.find=null; render(); return; }
  S.find=k; S.sel=null; S.route=false; S.tab="map"; S.view="map";
  const items=findItems(k);
  if (S.floor==="ALL" && ["quiet","busy","lift"].includes(k)) { render(); return; }
  if (items.length && !items.some(i=>i.floor===S.floor)) S.floor=items[0].floor;
  render();
}
function renderFind(p){
  const k=S.find, cfg=FIND[k], items=findItems(k);
  const here=items.filter(i=>i.floor===S.floor), other=items.filter(i=>i.floor!==S.floor);
  if (S.floor==="ALL") { here.length=0; }
  const row=i=>`<li><button class="hit-row" ${i.room?`data-open="${esc(i.room)}"`:`data-floorgo="${i.floor}"`}><span class="ic">${LAYER_ICON[k]}</span><span><b>${esc(i.name)}</b><span>${esc([i.floor===S.floor?"":lvl(i.floor), i.meta].filter(Boolean).join(" · ")||lvl(i.floor))}</span></span></button></li>`;
  const grouped = other.reduce((m,i)=>((m[i.floor]=m[i.floor]||[]).push(i),m),{});
  const otherHTML = k==="lift"||k==="seat"||k==="wc"
    ? Object.entries(grouped).map(([fl,arr])=>`<li><button class="hit-row" data-floorgo="${fl}"><span class="ic">${LAYER_ICON[k]}</span><span><b>${esc(lvl(fl))}</b><span>${arr.length} ${arr.length===1?"place":"places"}</span></span></button></li>`).join("")
    : other.map(row).join("");
  p.innerHTML=`<button class="x" aria-label="Close">${ICON.x}</button>
    <h2>${esc(cfg.title)}</h2><p class="meta">${esc(cfg.note)}</p>
    ${here.length?`<div class="sec"><h3>On ${esc(lvl(S.floor))}</h3><ul class="hits">${here.map(row).join("")}</ul></div>`:""}
    ${otherHTML?`<div class="sec"><h3>${S.floor==="ALL"?"Levels":"Other levels"}</h3><ul class="hits">${otherHTML}</ul></div>`:""}`;
  p.querySelector(".x").onclick=()=>{S.find=null; render();};
  p.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRoom(b.dataset.open));
  p.querySelectorAll("[data-floorgo]").forEach(b=>b.onclick=()=>{S.floor=b.dataset.floorgo; render();});
}


// ---------- directions ----------
const ENTRANCE = "__entrance__";
const CY = CORR.y + CORR.h/2;
const isLvl=n=>typeof n==="string"&&n.startsWith("lvl:");
const SCENES=[
  {floor:"P0", text:"Registration, posters, demos"},
  {floor:"P1", text:"Long corridor, rooms 111–134"},
  {floor:"M2", text:"Small rooms, quiet room"},
  {floor:"P2", text:"Banquet hall"},
  {floor:"M1", text:"VIP room"},
  {floor:"AUD", text:"Auditorium"}];
function lastSession(){ const plan=STORE.read("plan"); let best=null; Object.entries(SCHED).forEach(([n,l])=>{ if(!ROOMS[n]) return; l.forEach(e=>{ if(e.date!==TODAY||e.end>NOW) return; const mine=!!(e.sessionId&&plan.includes(e.sessionId)); if(!best||e.end>best.end||(e.end===best.end&&mine&&!best.mine)) best={room:n,end:e.end,title:e.title,mine}; }); }); return best; }
function doorOf(name){ if(name===ENTRANCE) return {x:180, y:250, floor:"P0"}; if(isLvl(name)){ const fl=name.slice(4); return {x:180, y:CY, floor:fl, unknown:true}; } const r=ROOMS[name]; return {x:r.x+r.w/2, y:r.y>CORR.y?r.y:r.y+r.h, floor:r.floor}; }
function fromLabel(n){ return n===ENTRANCE ? "Main entrance" : isLvl(n) ? "On "+lvl(n.slice(4)) : title(n); }
function liftOn(floor, label){ return F[floor].fac.find(x=>x.type==="lift"&&x.label===label); }
function routeView(){ const fl=doorOf(S.from).floor; return (fl==="AUD" && ROOMS[S.sel].floor!=="AUD") ? "P0" : fl; }
function defaultFrom(){ const ls=lastSession(); return ls ? ls.room : ENTRANCE; }
function liftOptions(){ const to=ROOMS[S.sel]; if(!S.from||S.from===S.sel) return [];
  const f1=doorOf(S.from).floor==="AUD"?"P0":doorOf(S.from).floor, f2=to.floor==="AUD"?"P0":to.floor; if(f1===f2) return [];
  const a=F[f1].fac.filter(x=>x.type==="lift").map(x=>x.label), b=F[f2].fac.filter(x=>x.type==="lift").map(x=>x.label);
  return a.filter(l=>b.includes(l)); }
function routeLift(){ const opts=liftOptions(); if(S.lift && opts.includes(S.lift)) return S.lift; return autoLift(); }
function autoLift(){ const to=ROOMS[S.sel]; const fromFloor=doorOf(S.from).floor;
  const ref = to.floor!=="AUD" ? to : null; const l = ref ? nearLift(ref) : nearLift(S.from===ENTRANCE?{floor:"P0",x:170,w:20}:{floor:doorOf(S.from).floor,x:doorOf(S.from).x,w:0}); return l ? l.label : "Elevator A"; }
function setFrom(name){ S.from=name; S.lift=null; S.picking=false; S.floor=routeView(); render(); }
function planRoute(){
  const to=ROOMS[S.sel], a=doorOf(S.from), b=doorOf(S.sel), L=routeLift(), toName=title(S.sel);
  if (S.from===S.sel) return [{floor:to.floor, text:`You're already at ${toName}`}];
  if (to.floor==="AUD"){
    const s=[]; if(a.floor!=="P0") s.push({floor:a.floor, text:`Take ${L} down to Level P0`});
    s.push({floor:"P0", text:`Leave the main building`}, {floor:"AUD", text:`Walk about 500 steps to the Auditorium — seating along the way`}); return s; }
  const near = nearLift(to)?", next to "+nearLift(to).label:"";
  const arrive = (nearLift(to)&&nearLift(to).label!==L) ? `From ${L}, follow the corridor to ${toName}` : `Follow the corridor to ${toName}${near}`;
  if (a.floor==="AUD"){ const s=[{floor:"AUD", text:`Walk about 500 steps back to the main building (Level P0) — seating along the way`}];
    if (to.floor==="P0") s.push({floor:"P0", text:`Follow the corridor to ${toName}`});
    else s.push({floor:"P0", text:`Go to ${L} and take it to Level ${to.floor} — no stairs or escalators`},{floor:to.floor, text:arrive});
    return s; }
  if (isLvl(S.from)){
    if (a.floor===to.floor) return [{floor:a.floor, text:`Find the main corridor — room numbers are on every door`},{floor:a.floor, text:`Follow it to ${toName}${near}`}];
    return [{floor:a.floor, text:S.lift?`Go to ${L}`:`Go to the nearest elevator`},{floor:a.floor, text:`Take it to Level ${to.floor} — no stairs or escalators`},{floor:to.floor, text:arrive}]; }
  if (a.floor===to.floor) return [
    {floor:a.floor, text:S.from===ENTRANCE?`From the main entrance, walk into the corridor`:`Leave ${fromLabel(S.from)} into the corridor`},
    {floor:a.floor, text:`Follow the corridor to ${toName}${nearLift(to)?", next to "+nearLift(to).label:""}`}];
  return [
    {floor:a.floor, text:S.from===ENTRANCE?`From the main entrance, go to ${L} (about 50 steps)`:`Leave ${fromLabel(S.from)} and go to ${L}`},
    {floor:a.floor, text:`Take ${L} to Level ${to.floor} — no stairs or escalators`},
    {floor:to.floor, text:arrive}];
}
function routeSVG(f){
  const to=ROOMS[S.sel], a=doorOf(S.from), b=doorOf(S.sel), L=routeLift();
  if (S.from===S.sel) return "";
  let pts=null, s="";
  if (a.floor==="AUD" && to.floor!=="AUD"){ const l=liftOn("P0",L); if(f.id==="P0") pts = to.floor==="P0" ? [[180,250],[180,CY],[b.x,CY],[b.x,b.y]] : (l?[[180,250],[180,CY],[l.x,CY]]:null); }
  if (a.unknown && f.id===a.floor && f.id!==to.floor) pts=null;
  else if (a.unknown && f.id===a.floor) pts=[[b.x,CY],[b.x,b.y]];
  else if (pts) {}
  else if (f.id===a.floor && f.id===to.floor) pts=[[a.x,a.y],[a.x,CY],[b.x,CY],[b.x,b.y]];
  else if (f.id===a.floor && to.floor!=="AUD"){ const l=liftOn(f.id,L); if(l) pts=[[a.x,a.y],[a.x,CY],[l.x,CY]]; }
  else if (f.id===to.floor && to.floor!=="AUD"){ const l=liftOn(f.id,L); if(l) pts=[[l.x,CY],[b.x,CY],[b.x,b.y]]; }
  else if (f.id===a.floor && to.floor==="AUD") pts=[[a.x,a.y],[a.x,CY],[350,CY]];
  if (pts) s+=`<polyline class="route" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  return s;
}
function youSVG(f){ if(S.from===S.sel) return ""; const a=doorOf(S.from); let s=""; if(a.unknown) return s;
  if (f.id===a.floor) s+=`<g aria-hidden="true"><circle cx="${a.x}" cy="${a.y}" r="7" fill="#3b6fd8" stroke="#fff" stroke-width="2.5"/><text x="${a.x}" y="${a.y+(a.y>CY?16:-10)}" text-anchor="middle" style="font-size:7px;font-weight:800;fill:#3b6fd8">YOU</text></g>`;
  return s;
}
function renderRoute(p){
  const to=ROOMS[S.sel];
  const head=`<button class="back" id="routeBack">← ${esc(title(S.sel))}</button><h2>Directions</h2>`;
  if (!S.from){
    const ls=lastSession();
    const def = ls ? {name:ls.room, b:`Just left ${title(ls.room)}`, s:`${ls.title} · ended ${ls.end}`, ic:ICON.door}
                   : {name:ENTRANCE, b:"Main entrance", s:"Level P0 · Registration", ic:ICON.door};
    p.innerHTML=`${head}<p class="meta">To ${esc(title(S.sel))} · ${esc(lvl(to.floor))}</p>
      <div class="sec"><h3>Where are you now?</h3>
        <button class="quick" id="fromDef"><span class="ic" style="background:var(--surface-2)">${def.ic}</span><span><b>${esc(def.b)}</b><span>${esc(def.s)}</span></span></button>
        <label class="fromsel"><span>Or type the nearest door number or sign</span><input id="fromQ" type="search" autocomplete="off" placeholder="e.g. 120, M215, Banquet Hall"></label>
        <div class="fromres" id="fromRes" role="listbox" aria-label="Matching places"></div></div>
      <div class="sec"><h3>No sign nearby? What's around you?</h3>
        <div class="scenes">${SCENES.map(c=>`<button data-lvl="${c.floor}">${esc(c.text)}</button>`).join("")}</div>
        <p class="srcline">Still unsure? Every elevator shows the level.</p></div>`;
    document.getElementById("fromDef").onclick=()=>setFrom(def.name);
    const q=document.getElementById("fromQ"), res=document.getElementById("fromRes");
    q.oninput=()=>{ const v=q.value.trim().toLowerCase(); if(!v){res.innerHTML=""; return;}
      const key=n=>{ const s=title(n).toLowerCase().replace(/^room /,""); return s.startsWith(v)?0:1; };
      const hits=Object.keys(ROOMS).filter(n=>title(n).toLowerCase().includes(v)||n.toLowerCase().includes(v)).sort((a,b)=>key(a)-key(b)||title(a).localeCompare(title(b),undefined,{numeric:true})).slice(0,4);
      res.innerHTML = hits.length ? hits.map(n=>`<button role="option" data-from="${esc(n)}"><b>${esc(title(n))}</b><span>${esc(lvl(ROOMS[n].floor))}</span></button>`).join("")
        : `<p class="srcline">No match — try the number on the nearest door.</p>`;
      res.querySelectorAll("[data-from]").forEach(b=>b.onclick=()=>setFrom(b.dataset.from)); };
    q.onkeydown=e=>{ if(e.key==="Enter"){ const b=res.querySelector("[data-from]"); if(b) b.click(); } };
    p.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>setFrom(b.dataset.lvl==="AUD"?"Auditorium":"lvl:"+b.dataset.lvl));
  } else {
    const steps=planRoute(), fl=[...new Set(steps.map(s=>s.floor))];
    p.innerHTML=`${head}
      <div class="ft"><div><span class="dot you"></span><b>${esc(fromLabel(S.from))}</b><span>${esc(lvl(doorOf(S.from).floor))}</span><button id="changeFrom">Change</button></div>
        <div><span class="dot to"></span><b>${esc(title(S.sel))}</b><span>${esc(lvl(to.floor))}</span></div></div>
      ${(()=>{ const opts=liftOptions(); if(opts.length<2) return ""; const auto=autoLift(), cur=routeLift();
        return `<div class="sec"><h3>Route options</h3><div class="ropts" role="radiogroup" aria-label="Route options">${[auto,...opts.filter(o=>o!==auto)].map(o=>`<button role="radio" data-lift="${esc(o)}" aria-checked="${o===cur}"><b>Via ${esc(o)}</b><span>${o===auto?`Recommended · closest to ${esc(title(S.sel))}`:`If ${esc(auto)} is busy or out of service`}</span></button>`).join("")}</div></div>`; })()}
      ${fl.length>1?`<div class="sec"><h3>Your trip</h3><div class="tripbox">${overviewSVG(true)}</div></div>`:""}
      <div class="sec"><h3>Step-free route</h3><ol class="steps">${steps.map(s=>`<li><span>${esc(s.text)}${fl.length>1?` <button class="flv" data-showfloor="${s.floor}" aria-pressed="${s.floor===S.floor}">${esc(s.floor==="AUD"?"Aud.":s.floor)}</button>`:""}</span></li>`).join("")}</ol></div>`;
    document.getElementById("changeFrom").onclick=()=>{S.from=null; render();};
    p.querySelectorAll("[data-lift]").forEach(b=>b.onclick=()=>{S.lift=b.dataset.lift; render();});
    p.querySelectorAll("[data-showfloor]").forEach(b=>b.onclick=()=>{S.floor=b.dataset.showfloor; render();});
  }
  document.getElementById("routeBack").onclick=()=>{S.route=false; S.from=null; S.picking=false; S.floor=to.floor; render();};
}


// ---------- all-levels overview ----------
const STACK = ["P2","M2","P1","M1","P0"];
function overviewSVG(compact=false){
  const W=compact?300:250, D=compact?44:40, SK=46, X0=compact?70:170, GAP=compact?60:66, TOP=18;
  // Level descriptions wrap onto at most two lines so they never run into the slabs.
  const wrapDesc=t=>{ const parts=t.split(" · "), lines=[""]; parts.forEach(p=>{ const cur=lines[lines.length-1]; if(cur && (cur+" · "+p).length>22 && lines.length<2) lines.push(p); else lines[lines.length-1]=cur?cur+" · "+p:p; }); return lines; };
  const tgt = S.sel && ROOMS[S.sel] ? ROOMS[S.sel] : null;
  const fromD = S.route && S.from ? doorOf(S.from) : null;
  const H = TOP + GAP*STACK.length + 40;
  const pt=(i,x,y)=>{ const u=(x-10)/340, v=Math.max(0,Math.min(1,(y-30)/230)), yy=TOP+i*GAP; return [X0+SK*(1-v)+W*u, yy+D*v]; };
  const poly=(i,r)=>[pt(i,r.x,r.y),pt(i,r.x+r.w,r.y),pt(i,r.x+r.w,r.y+r.h),pt(i,r.x,r.y+r.h)].map(q=>q.map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=`<svg class="ov" viewBox="0 0 ${compact?520:550} ${H}" role="group" aria-label="All levels, top to bottom: ${STACK.join(", ")}, plus the Auditorium in a separate building">
    <defs><pattern id="ovbusy" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--busy-soft)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--busy)" stroke-width="1.2" opacity=".6"/></pattern></defs>`;
  // elevator shafts
  const lifts=[60,262];
  lifts.forEach(x=>{ const a=pt(0,x,150), b=pt(STACK.length-1,x,150); s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="shaft${S.find==="lift"?" on":""}"/>`; });
  STACK.forEach((id,i)=>{
    const f=F[id], yy=TOP+i*GAP, act=S.floor===id, isT=tgt&&tgt.floor===id, isF=fromD&&fromD.floor===id;
    const slab=`${X0+SK},${yy} ${X0+SK+W},${yy} ${X0+W},${yy+D} ${X0},${yy+D}`;
    s+=`<g class="slab${act?" act":""}${isT?" tgt":""}${isF?" frm":""}" data-floor="${id}" tabindex="0" role="button" aria-label="Level ${id}: ${esc(f.desc)}${isT?", your destination":""}${isF?", you are here":""}">
      <polygon class="side" points="${X0},${yy+D} ${X0+W},${yy+D} ${X0+W},${yy+D+5} ${X0},${yy+D+5}"/>
      <polygon class="top" points="${slab}"/>`;
    if (id!=="M1") s+=`<polygon class="cor" points="${poly(i,{x:10,y:CORR.y,w:340,h:CORR.h})}"/>`;
    f.rooms.forEach(r=>{
      if (r.quiet) s+=`<polygon class="z-quiet${S.find==="quiet"?" on":""}" points="${poly(i,r)}"/>`;
      else if (r.busy) s+=`<polygon class="z-busy${S.find==="busy"?" on":""}" points="${poly(i,r)}"/>`;
      if (isT && r===tgt) s+=`<polygon class="z-tgt" points="${poly(i,r)}"/>`;
    });
    lifts.forEach(x=>{ const q=pt(i,x,150); s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${S.find==="lift"?4.5:3.5}" class="ldot"/>`; });
    if (isF && S.from && !fromD.unknown){ const q = S.from===ENTRANCE ? pt(i,180,250) : pt(i,doorOf(S.from).x,doorOf(S.from).y); s+=`<circle cx="${q[0]}" cy="${q[1]}" r="5" class="you"/>`; }
    if (isT){ const c=pt(i,tgt.x+tgt.w/2,tgt.y); s+=`<path d="M${c[0]} ${c[1]} l-5 -8 a6 6 0 1 1 10 0 z" class="pinm"/>`; }
    s+=compact ? `<text x="10" y="${yy+D/2+8}" class="lv" style="font-size:22px">${id}</text></g>` : `<text x="10" y="${yy+D/2-4}" class="lv">${id}</text>${wrapDesc(f.desc).map((l,k)=>`<text x="10" y="${yy+D/2+9+k*11}" class="ld">${esc(l)}</text>`).join("")}</g>`;
  });
  // auditorium
  // route across levels
  if (fromD && tgt && fromD.floor!==tgt.floor && tgt.floor!=="AUD" && !(fromD.floor==="AUD"&&tgt.floor==="P0")){
    const L=routeLift(), lx=(liftOn(tgt.floor,L)||{x:60}).x, i1=STACK.indexOf(fromD.floor==="AUD"?"P0":fromD.floor), i2=STACK.indexOf(tgt.floor);
    if (i1>=0&&i2>=0){ const a=pt(i1,lx,150), b=pt(i2,lx,150); s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="trip"/>`; }
  }
  if (compact) return s+`</svg>`;
  const ay=TOP+(STACK.length-1)*GAP+6, ax=450, aud=F.AUD, isT=tgt&&tgt.floor==="AUD";
  s+=`<g class="slab aud${S.floor==="AUD"?" act":""}${isT?" tgt":""}" data-floor="AUD" tabindex="0" role="button" aria-label="Auditorium, separate building${isT?", your destination":""}">
     <polygon class="side" points="${ax},${ay+34} ${ax+70},${ay+34} ${ax+70},${ay+39} ${ax},${ay+39}"/>
     <polygon class="top" points="${ax+22},${ay} ${ax+92},${ay} ${ax+70},${ay+34} ${ax},${ay+34}"/>
     ${isT?`<polygon class="z-tgt" points="${ax+22},${ay} ${ax+92},${ay} ${ax+70},${ay+34} ${ax},${ay+34}"/>`:""}
     <text x="${ax+46}" y="${ay+52}" text-anchor="middle" class="ld">Auditorium</text></g>
     <line x1="${X0+W+4}" y1="${ay+22}" x2="${ax-4}" y2="${ay+22}" class="walk"/>`;
  return s+`</svg>`;
}

  document.getElementById("viewseg").style.visibility = !S.q ? "visible" : "hidden";
  syncURL();
  document.querySelectorAll("#viewseg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.view===S.view)));
  if (S.q) return renderSearch();

        <nav class="floorbar" aria-label="Floors">${floors}</nav>
        <div class="layerbar" role="group" aria-label="Find on map">${layers}</div></div></section>

  screen.querySelectorAll("[data-floor]").forEach(b=>{ b.onclick=()=>{ const toLevel=b.classList.contains("slab"); S.floor=b.dataset.floor; if(!S.route && !(toLevel && S.sel && ROOMS[S.sel].floor===S.floor)){S.sel=null;} render(); };
    if (b.classList.contains("slab")) b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault(); b.onclick();} }); });
  const cp=document.getElementById("cancelPick"); if(cp) cp.onclick=()=>{S.picking=false; S.floor=ROOMS[S.sel].floor; render();};
  const rbk=document.getElementById("retBack"); if(rbk) rbk.onclick=()=>{ const r=S.ret; S.ret=null; S.route=false; S.from=null; S.sel=null;
    S.q=r.slice(2); document.getElementById("q").value=S.q; render(); };
  const pbk=document.getElementById("pageBack"); if(pbk) pbk.onclick=()=>history.back();

    el.addEventListener("click",go); el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} }); });

function a11yList(n){
  const r=CHI.rooms[n], T=(ok,yes,no)=>ok===undefined?`<span class="tag unk">Unknown</span>`:ok?`<span class="tag ok">${yes}</span>`:`<span class="tag no">${no}</span>`;
  return `<ul class="a11y">
  <li>Step-free access${T(r&&r.stepFree,"Confirmed","Not step-free")}</li>
  <li>Sensory-friendly${T(r&&r.sensoryFriendly,"Yes","No")}</li>
  <li>Crowding${r?`<span class="tag ${r.crowding==="high"?"no":"ok"}">${r.crowding==="high"?"Often crowded":r.crowding==="medium"?"Moderate":"Usually calm"}</span>`:`<span class="tag unk">Unknown</span>`}</li>
  <li>Temperature${r?`<span class="tag ${r.temperature==="comfortable"?"ok":"unk"}">${r.temperature==="warm"?"Often warm":r.temperature==="cool"?"Often cool":"Comfortable"}</span>`:`<span class="tag unk">Unknown</span>`}</li>
  <li>Microphones for speakers &amp; Q&amp;A<span class="tag ok">Confirmed</span></li>
  <li>Hearing loop<span class="tag no">Not available</span></li></ul>
  <p class="srcline">Venue-wide items from the <a href="../accessibility/">Accessibility FAQ</a></p>`;
}

function renderPanel(){

    p.innerHTML=`<div class="empty"><h2>Find your way</h2><p>Tap a room on the map, or:</p>
${(()=>{ const n=nextUp(); return n?`<button class="quick" data-open="${esc(n.room)}"><span class="ic" style="background:var(--accent-soft);color:var(--accent-ink)">${ICON.pin}</span><span><b>${n.mine?"My next session":"Next session"}</b><span>${esc(nextLabel(n))}</span></span></button>`:""; })()}
      <button class="quick" data-open="M2 - Room M219"><span class="ic" style="background:var(--quiet-soft);color:var(--quiet)">${ICON.leaf}</span><span><b>Find a quiet room</b><span>Room M219 · Level M2</span></span></button>

  }

  if (r.quiet){
    p.innerHTML=`<button class="x" aria-label="Close">${ICON.x}</button><h2>Quiet Room · M219</h2><p class="meta">Level M2${lm?" · "+esc(lm):""}</p>${route}
      <div class="sec"><h3>About this space</h3><ul class="a11y"><li>Room M219 on Level M2, signposted<span class="tag ok">Confirmed</span></li><li>Shown on this map<span class="tag ok">Yes</span></li><li>Opening hours<span class="tag unk">Unknown</span></li></ul>
      <p class="srcline">Same room as in the <a href="../accessibility/?need=sens">Accessibility FAQ</a></p></div>`;

      <div class="sec"><h3>About this space</h3><p>${esc(r.note)}</p><p class="srcline">From the <a href="../accessibility/">Accessibility FAQ</a></p></div>`;
  } else {
    const c=capInfo(S.sel);
    const days=[...new Set(d.all.map(e=>e.date))];
    const sess = days.length ? days.map(day=>`<h4 class="sday">${day===TODAY?"Today · ":""}${esc(dayShort(day))}</h4>`+d.all.filter(e=>e.date===day).map(e=>`<a class="ses" href="${e.href}"><span class="t">${e.start} – ${e.end}</span><span>${esc(e.title)}${day===TODAY&&e.start<=NOW&&NOW<e.end?'<span class="live">NOW</span>':""}<small>${esc(e.kind)}${e.awards?" · "+e.awards+" award paper"+(e.awards>1?"s":""):""}${e.sessionId&&STORE.read("plan").includes(e.sessionId)?" · In My plan":""}</small></span></a>`).join("")).join("") : `<p class="srcline">No sessions scheduled in this room.</p>`;
    p.innerHTML=`<button class="x" aria-label="Close">${ICON.x}</button><h2>${esc(title(S.sel))}</h2><p class="meta">${esc(where(S.sel))}${lm?" · "+esc(lm):""}</p>${route}
      <div class="sec"><h3>Sessions here</h3>${sess}</div>
      ${c?`<div class="sec"><h3>Capacity</h3><div class="cap-row"><span class="meter"><b style="width:${c.small?90:c.c>=500?25:55}%"></b></span>${c.c} seats${c.small?" · may fill up — arrive early":""}</div></div>`:""}
      <div class="sec"><h3>Accessibility</h3>${a11yList(S.sel)}</div>
      <div class="sec"><h3>Need a break?</h3><button class="rest" id="toQuiet"><span class="ic">${ICON.leaf}</span><span><b>Quiet Room M219</b><span>Level M2 · by elevator</span></span></button></div>`;
  }
  p.querySelector(".x").onclick=()=>{S.sel=null; S.route=false; S.from=null; render();};
  const rb=document.getElementById("routeBtn"); if(rb) rb.onclick=()=>{S.route=true; S.from=defaultFrom(); S.lift=null; S.floor=routeView(); S.picking=false; render();};
  const tq=document.getElementById("toQuiet"); if(tq) tq.onclick=()=>openRoom("M2 - Room M219");
}

function renderList(){
  const typeIcon={lift:"lift",wc:"wc",seat:"seat"};
  const idx = FLOORS.map(f=>`<a href="#lv-${f.id}" data-jump="${f.id}"><b>${esc(f.label==="Auditorium"?"Auditorium":f.label)}</b><span>${f.rooms.length} ${f.rooms.length===1?"space":"spaces"}</span></a>`).join("");
  const secs = FLOORS.map(f=>{
    const facs=[...new Map(f.fac.map(x=>[x.type,x])).values()];
    const facHTML = facs.length ? `<div class="facs">${facs.map(x=>{ const n=f.fac.filter(y=>y.type===x.type).length; const name={lift:"Elevator",wc:"Accessible restroom",seat:"Seating"}[x.type];
      return `<span class="fchip">${LAYER_ICON[typeIcon[x.type]]}${esc(name)}${n>1?` ×${n}`:""}</span>`; }).join("")}</div>` : "";
    const rooms=f.rooms.map(r=>{ const c=info(r.name).cap; const m=[c?c+" seats":"", landmark(r)].filter(Boolean).join(" · ");
      const tag = r.quiet?`<span class="rtag q">Quiet</span>`:r.busy?`<span class="rtag b">Busy</span>`:"";
      return `<li><button data-room="${esc(r.name)}"><span class="rn">${esc(title(r.name))}${tag}</span><span class="m">${esc(m)}</span></button></li>`; }).join("");
    return `<section class="lsec" id="lv-${f.id}" aria-labelledby="lh-${f.id}">
      <h2 id="lh-${f.id}">${esc(f.label==="Auditorium"?"Auditorium":"Level "+f.label)}<span>${esc(f.desc)}</span></h2>
      ${facHTML}<ul class="rgrid">${rooms}</ul></section>`; }).join("");
  screen.innerHTML = `<div class="listview2" id="lv"><nav class="lindex" aria-label="Jump to level">${idx}</nav><div class="lbody">${secs}</div></div>`;
  const box=document.getElementById("lv");
  const links=[...box.querySelectorAll("[data-jump]")];
  let lock=null;
  links.forEach(a=>a.onclick=e=>{ e.preventDefault(); lock=a.dataset.jump; setTimeout(()=>{lock=null;},900); links.forEach(x=>x.setAttribute("aria-current", x===a?"true":"false")); const sec=document.getElementById("lv-"+a.dataset.jump);
    box.scrollTo({top: sec.offsetTop - box.querySelector(".lindex").offsetHeight - 8, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); sec.querySelector("h2").setAttribute("tabindex","-1"); sec.querySelector("h2").focus({preventScroll:true}); });
  const spy=()=>{ if(lock) return; const top=box.scrollTop + box.querySelector(".lindex").offsetHeight + 20; let cur=FLOORS[0].id;
    FLOORS.forEach(f=>{ if(document.getElementById("lv-"+f.id).offsetTop<=top) cur=f.id; });
    links.forEach(a=>a.setAttribute("aria-current", a.dataset.jump===cur ? "true" : "false")); };
  box.addEventListener("scroll", spy); spy();
  screen.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>openRoom(b.dataset.room));
}

const INTENTS=[
  {k:"quiet", words:["quiet","calm","rest","break","sensory","relax","silent","tired"], label:"Quiet room", sub:"Show on the map"},
  {k:"lift", words:["wheelchair","step-free","step free","elevator","lift","accessible","access","ramp","mobility"], label:"Step-free access: elevators", sub:"Every session room is step-free · show elevators"},
  {k:"wc", words:["restroom","toilet","bathroom","washroom","wc","loo"], label:"Accessible restrooms", sub:"Show on the map"},
  {k:"seat", words:["seat","sit","bench","seating"], label:"Seating", sub:"Places to sit along the corridors"},
  {k:"busy", words:["busy","crowd","crowded","loud","noisy","noise"], label:"Busy & loud areas", sub:"Show on the map"},
  {k:"full", words:["full","fill","small room","popular","capacity","seats","packed"], label:"Sessions that may fill up", sub:"Small rooms today — arrive early"}];
function matchIntents(q){ return INTENTS.filter(it=>it.words.some(w=>q.includes(w)||(q.length>=3&&w.startsWith(q)))); }
function renderSearch(){
  const q=S.q.toLowerCase(), hits=[];
  const intents=matchIntents(q);
  Object.values(ROOMS).forEach(r=>{ const t=title(r.name); if(t.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)) hits.push([t, r.name, where(r.name)]); });
  Object.entries(SCHED).forEach(([room,l])=>l.forEach(e=>{ if(e.title.toLowerCase().includes(q)&&ROOMS[room]) hits.push([e.title, room, `${dayShort(e.date)} ${e.start} · ${ROOMS[room].floor==="AUD"?"Auditorium":ROOMS[room].floor+" · "+title(room)}`]); }));
  FLOORS.forEach(f=>[...new Set(f.fac.map(x=>x.label))].forEach(l=>{ if(l.toLowerCase().includes(q)) hits.push([l, null, f.label==="Auditorium"?"Auditorium":"Level "+f.label]); }));
  if (intents.some(it=>it.k==="full")) Object.entries(SCHED).forEach(([room,l])=>{ const c=capInfo(room); if(c&&c.small) l.filter(e=>e.date===TODAY).forEach(e=>hits.push([e.title, room, `${e.start} · ${c.c} seats · ${ROOMS[room].floor} · ${title(room)}`])); });
  const seen=new Set(), uniq=hits.filter(h=>{const k=h[0]+h[2]; if(seen.has(k)) return false; seen.add(k); return true;}).slice(0,40);
  const intentHTML = intents.filter(it=>it.k!=="full").map(it=>`<li><button class="intent" data-intent="${it.k}"><span class="ic">${LAYER_ICON[it.k]}</span><span><b>${esc(it.label)}</b><span>${esc(it.sub)}</span></span><span class="m">Show →</span></button></li>`).join("");
  const fullHead = intents.some(it=>it.k==="full") ? `<p class="hint">Today’s sessions in rooms with 80 seats or fewer — arrive early.</p>` : "";
  const total = uniq.length + intents.filter(it=>it.k!=="full").length;
  screen.innerHTML = `<div class="results"><h1>${total} result${total===1?"":"s"} for “${esc(S.q)}”</h1>
    ${intentHTML?`<ul class="intents">${intentHTML}</ul>`:""}${fullHead}
    ${uniq.length?`<ul>${uniq.map(([t,room,m])=>`<li>${room?`<button data-room="${esc(room)}">`:"<div>"}<span>${esc(t)}</span><span class="m">${esc(m)}</span>${room?"</button>":"</div>"}</li>`).join("")}</ul>`:(intentHTML?"":`<p class="none">No results. Try “123”, “quiet”, “wheelchair”, or “full”.</p>`)}</div>`;
  const clearQ=()=>{ const keep=S.q; document.getElementById("q").value=""; S.q=""; return keep; };
  screen.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{ const k=clearQ(); openRoom(b.dataset.room,false,"q:"+k); });
  screen.querySelectorAll("[data-intent]").forEach(b=>b.onclick=()=>{ const k=clearQ(); setFind(b.dataset.intent); S.ret="q:"+k; render(); });
}

function openRoom(name, route=false, ret=null){ const r=ROOMS[name]; if(!r) return; S.ret=ret; S.tab="map"; S.view="map"; S.sel=name; S.route=route; S.lift=null; S.from=route?defaultFrom():null; S.floor=r.floor; if(route) S.floor=routeView(); S.picking=false; S.find=null; render(); screen.focus({preventScroll:true}); }

document.querySelectorAll("#viewseg button").forEach(b=>b.onclick=()=>{S.view=b.dataset.view; render();});
document.getElementById("q").addEventListener("input",e=>{S.q=e.target.value.trim(); render();});
document.getElementById("nowChip").textContent = CHI.now.label;

// ---- links from other pages: ?room=…  ?find=quiet  ?level=M2  (Back returns to where you came from) ----
const SECTIONS = {program:"Program", people:"People", awards:"Awards", accessibility:"Accessibility", my:"My"};
let BACK = null, ARRIVED = null;
try { const ref = new URL(document.referrer); const seg = ref.pathname.split("/").filter(Boolean).slice(-1)[0];
  if (ref.origin===location.origin && SECTIONS[seg] && history.length>1) BACK = SECTIONS[seg]; } catch(e) {}
function syncURL(){
  const p=new URLSearchParams();
  if (S.sel) p.set("room", S.sel); else if (S.find) p.set("find", S.find); else if (S.floor && S.floor!=="ALL") p.set("level", S.floor);
  if (S.view==="list") p.set("view","list");
  const q=p.toString(), url=location.pathname+(q?"?"+q:"");
  if (url!==location.pathname+location.search) history.replaceState(history.state, "", url);
}
(function(){
  const p=new URLSearchParams(location.search), room=p.get("room"), find=p.get("find"), level=p.get("level");
  if (p.get("view")==="list") S.view="list";
  if (level && F[level]) S.floor=level;
  if (room && ROOMS[room]) { ARRIVED=room; openRoom(room); return; }
  if (find && FIND[find]) { setFind(find); return; }
  render();
})();
window.addEventListener("chi-store", ()=>render());
</script>
