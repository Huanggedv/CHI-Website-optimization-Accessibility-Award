<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accessibility · CHI 2027</title>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/site.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body data-page="accessibility">
<script src="../shared/shell.js"></script>
<template id="dc-template">
<helmet>
<style>
body{margin:0;background:#FFFFFF}
#dc-root h1{font-size:clamp(40px,11vw,72px)!important}
@media (max-width:600px){#dc-root section{padding-left:16px!important;padding-right:16px!important}#dc-root section:first-child{padding-top:32px!important}}
a{color:#000000}a:hover{color:#000000}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #000000;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Geist', system-ui, sans-serif; color: #000000; background: #FFFFFF; min-height: 100vh">

<div style="display: flex; flex-wrap: wrap; align-items: stretch">

<div style="flex: 999 1 640px; min-width: 0">


<section class="std-hero" aria-labelledby="access-title">
<div class="std-hero-grid">
<div>
<h1 id="access-title">CHI 2027 Accessibility FAQ</h1>
</div>
<aside class="std-hero-card" aria-label="Request deadline">
<span>Request deadline</span>
<strong>12 March</strong>
<a href="mailto:access@chi2027.acm.org">Email the Access Chairs</a>
</aside>
</div>
</section>

<section aria-labelledby="steps-h" style="max-width: 1120px; margin: 0 auto; padding: 0 24px 72px">
<h2 id="steps-h" style="margin: 0 0 24px; font-family: Geist, system-ui, sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">Request Process</h2>
<div style="background: #F5F5F5; display: flex; flex-wrap: wrap">
<div style="flex: 999 1 460px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px">
<h3 style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">Your requests</h3>
<span style="font-size: 13px; color: #6b6b6b">{{progressText}}</span>
</div>
<ol aria-label="Your requests and their status" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{requests}}" as="rq" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span aria-hidden="true" style="display: block; height: 6px; background: {{rq.bar}}"></span>
<span style="font-size: 15px; line-height: 1.3; color: #000000">{{rq.label}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: {{rq.fg}}">
<sc-if value="{{rq.isDone}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{rq.isReview}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 1.5"></path></svg></sc-if>
{{rq.status}}</span>
</li>
</sc-for>
</ol>
</div>
<div style="flex: 1 1 280px; min-width: 0; padding: 24px; border-left: 1px solid #DDDDDD; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">How to request</h3>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; color: #333333">
<li style="display: flex; gap: 10px"><span style="flex: none; width: 16px; font-family: 'Geist Mono', monospace; color: #9a9a9a">1</span><span><b style="font-weight: 500; color: #000000">Register</b> · tick the support you need</span></li>
<li style="display: flex; gap: 10px"><span style="flex: none; width: 16px; font-family: 'Geist Mono', monospace; color: #9a9a9a">2</span><span><b style="font-weight: 500; color: #000000">By 12 March</b> · confirm your requests</span></li>
<li style="display: flex; gap: 10px"><span style="flex: none; width: 16px; font-family: 'Geist Mono', monospace; color: #9a9a9a">3</span><span><b style="font-weight: 500; color: #000000">On site</b> · ask any volunteer</span></li>
</ol>
</div>
</div>
</section>

<section aria-labelledby="answers-h" style="max-width: 1120px; margin: 0 auto; padding: 0 24px 72px">
<h2 id="answers-h" style="margin: 0 0 24px; font-family: Geist, system-ui, sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">FAQ by Need</h2>
<div role="group" aria-label="Filter answers by need" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="10">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="min-height: 48px; padding: 0 12px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font-size: 15px; font-weight: 500; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; margin: 32px 0 32px; padding: 16px 20px; border: 1px solid #CCCCCC; font-size: 13px; color: #6b6b6b">
<span style="font-weight: 600; color: #000000">{{countLabel}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="display: inline-block; font-weight: 500; font-size: 12px; line-height: 1.4; padding: 3px 8px; background: #000000; color: #FFFFFF">Available</span> ready on site</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="display: inline-block; font-weight: 500; font-size: 12px; line-height: 1.4; padding: 3px 8px; background: #4D4D4D; color: #FFFFFF">Request</span> ask in advance</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="display: inline-block; font-weight: 500; font-size: 12px; line-height: 1.4; padding: 2px 7px; border: 1px solid #000000; color: #000000">Not offered</span> not possible</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="display: inline-block; font-weight: 500; font-size: 12px; line-height: 1.4; padding: 3px 0 1px; border-bottom: 1px dashed #000000; color: #000000">Pending</span> not confirmed yet</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 32px">
<sc-for list="{{shown}}" as="item" hint-placeholder-count="6">
<article style="border-top: 1px solid #000000; padding: 20px 0 40px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 12px; color: #6b6b6b; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">{{item.catLabel}}</span>
<span style="flex: none; display: inline-block; padding: {{item.pillPad}}; border: {{item.pillBorder}}; border-bottom: {{item.pillUnder}}; background: {{item.pillBg}}; color: {{item.pillFg}}; font-weight: 500; font-size: 12px; line-height: 1.4">{{item.statusLabel}}</span>
</div>
<h3 style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">{{item.q}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #333333">{{item.a}}</p>
<sc-if value="{{item.hasDetails}}" hint-placeholder-val="{{true}}">
<button type="button" aria-expanded="{{item.expanded}}" onClick="{{item.toggle}}" style="align-self: flex-start; margin-top: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: none; background: none; color: #000000; font-size: 13px; font-weight: 600; cursor: pointer">{{item.toggleLabel}}
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6-6"></path></svg>
</button>
</sc-if>
<sc-if value="{{item.open}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 14px 16px; background: #F5F5F5; font-size: 14px; line-height: 1.55; color: #333333">{{item.d}}</p>
</sc-if>
</article>
</sc-for>
</div>
</section>

<section aria-labelledby="venue-h" style="max-width: 1120px; margin: 0 auto; padding: 0 24px 72px">
<h2 id="venue-h" style="margin: 0 0 24px; font-family: Geist, system-ui, sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">Venue Facilities</h2>
<p style="margin: -12px 0 20px; color: #6b6b6b; font-size: 14px">Tap a level or a space to open it on the <a href="../map/">Map</a>.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
<div style="flex: 999 1 560px; min-width: 0; border-top: 1px solid #000000">
<sc-for list="{{floors}}" as="fl" hint-placeholder-count="5">
<div style="display: flex; align-items: stretch; gap: 16px; padding: 16px 0; border-bottom: 1px solid {{fl.line}}">
<a href="{{fl.href}}" aria-label="Open level {{fl.code}} on the Map" style="flex: none; width: 56px; min-height: 44px; background: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Geist, system-ui, sans-serif; font-weight: 700; font-size: 15px; text-decoration: none">{{fl.code}}</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 8px">
<sc-for list="{{fl.items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="display: inline-flex; align-items: center; box-sizing: border-box; min-height: 44px; padding: 0 14px; border: 1px solid {{it.border}}; background: {{it.bg}}; color: {{it.fg}}; font-size: 13px; font-weight: 500; text-decoration: none">{{it.label}}</a>
</sc-for>
</div>
</div>
</sc-for>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 0">
<div style="flex: 1 1 0; border-top: 1px solid #000000; padding: 16px 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
<div style="font-size: 12px; color: #6b6b6b; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Longest walk</div>
<div style="font-family: Geist, system-ui, sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">≈ 350 m</div>
<div style="font-size: 13px; color: #6b6b6b">Main building → keynote auditorium</div>
</div>
<div style="flex: 1 1 0; border-top: 1px solid #000000; padding: 16px 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
<div style="font-size: 12px; color: #6b6b6b; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Indoor temperature</div>
<div style="font-family: Geist, system-ui, sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">23–25 °C</div>
<div style="font-size: 13px; color: #6b6b6b">Bring a light jacket</div>
</div>
<div style="flex: 1 1 0; border-top: 1px solid #000000; padding: 16px 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
<div style="font-size: 12px; color: #6b6b6b; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Emergency</div>
<div style="font-family: Geist, system-ui, sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500; color: #000000">911</div>
<div style="font-size: 13px; color: #6b6b6b">Non-urgent help: any student volunteer</div>
</div>
</div>
</div>
</section>

<footer style="max-width: 1120px; margin: 0 auto; padding: 0 24px 72px">
<div style="background: #000000; color: #FFFFFF; padding: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
<div style="flex: 999 1 420px; min-width: 0">
<h2 style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">Contact the Access Chairs</h2>
</div>
<a href="mailto:access@chi2027.acm.org" style="flex: none; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; background: #FFFFFF; color: #000000; font-weight: 500; font-size: 15px; text-decoration: none">access@chi2027.acm.org</a>
</div>
</footer>

</div>
</div>
</div>
</template>
<div id="main" tabindex="-1"><div id="dc-root"></div></div>
<script type="text/plain" data-dc-script data-props='{"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var need = new URLSearchParams(location.search).get('need'), sel = {};
    if (/^(mob|hear|vis|sens|food|fam|anim|pres|health)$/.test(need || '')) sel[need] = true;
    this.state = { sel: sel, open: {} };
  }
  renderVals() {
    var self = this;
    var FILTERS = [
      ['all', 'Everything'], ['mob', 'Mobility'], ['hear', 'Hearing'], ['vis', 'Vision'],
      ['sens', 'Sensory & quiet'], ['food', 'Food & diet'], ['fam', 'Family & faith'],
      ['anim', 'Service animals'], ['pres', 'Presenting'], ['health', 'Health & safety']
    ];
    var CAT = { mob: 'Mobility', hear: 'Hearing', vis: 'Vision', sens: 'Sensory & quiet', food: 'Food & diet', fam: 'Family & faith', anim: 'Service animals', pres: 'Presenting', health: 'Health & safety', gen: 'General' };
    var ST = {
      ok: ['Available', '#000000', '#FFFFFF', '3px 8px', '0', '0'],
      req: ['Request', '#4D4D4D', '#FFFFFF', '3px 8px', '0', '0'],
      no: ['Not offered', 'transparent', '#000000', '2px 7px', '1px solid #000000', '1px solid #000000'],
      pend: ['Pending', 'transparent', '#000000', '3px 0 1px', '0', '1px dashed #000000']
    };
    var ITEMS = [
      ['wheel', ['mob'], 'ok', 'Can I get around in a wheelchair?', 'Yes. Every entrance has an accessible door, and lifts connect all five floors.', 'Lifts fit standard wheelchairs; space may be tight for large power wheelchairs or mobility scooters. In the keynote auditorium, wheelchair seating is in the lower stalls near the entrances — the upper stalls are not accessible. Auditorium seats are about 42 cm wide with fixed armrests.'],
      ['asl', ['hear'], 'req', 'Will there be sign language or live captions?', 'Yes, if you ask. ASL interpreters or captioners are booked for attendees who request them by 12 March.', 'Tick the option on your registration form. Requests after 12 March are best-effort and cannot be guaranteed.'],
      ['quiet', ['sens'], 'ok', 'Is there a quiet room?', 'Yes — Room M219 on floor M2, clearly signposted and marked on the Map.', ''],
      ['walk', ['mob'], 'ok', 'How far will I need to walk?', 'Most walks are short. The longest is about 350 m, from the main building to the keynote auditorium.', 'Converted from the original step counts (1 step ≈ 0.7 m) — to be confirmed by the venue. Entrance → registration desk ≈ 35 m. Registration → nearest lift ≈ 35 m. Room door → stage ≈ 30 m. Each escalator has about 20 steps. Seating is available along corridors.'],
      ['vol', ['mob', 'vis'], 'req', 'Can a volunteer help me during the conference?', 'Yes. Student volunteers can help with finding your way, meal breaks and other needs. Ask for it on your registration form.', 'If you need personal care, bring your own assistant — they register for free. Email the Access Chairs for a registration code.'],
      ['loop', ['hear'], 'no', 'Is there an induction loop?', 'No. The venue has no induction loops or assistive listening devices.', 'If you need audio enhancement, contact the Access Chairs early to talk through other options.'],
      ['mic', ['hear'], 'ok', 'Will speakers use microphones?', 'Yes. Speakers and people asking questions are asked to use a microphone.', ''],
      ['light', ['sens'], 'ok', 'Will there be loud music, strobes or harsh light?', 'No loud music, strobes or spotlights are planned. Some people may find the ceiling lights uncomfortable.', 'Want more detail about the environment in advance? Mention it on your registration form or email the Access Chairs.'],
      ['scooter', ['mob'], 'req', 'Can I use a power scooter?', 'Yes — contact the Access Chairs as early as possible so they can plan for it.', ''],
      ['dog', ['anim', 'vis'], 'ok', 'Can I bring my guide dog?', 'Yes. Guide dogs and other service animals are welcome. The relief area is outside entrances C and D.', 'Let the organizers know on your registration form.'],
      ['rest', ['mob', 'fam'], 'ok', 'What are the restrooms like?', 'Every floor has at least one gender-neutral restroom, and every restroom has a wheelchair-accessible stall.', ''],
      ['child', ['fam'], 'ok', 'Is there childcare or a nursing room?', 'Yes — both are on floor P2.', ''],
      ['prayer', ['fam'], 'ok', 'Is there a prayer room?', 'Yes. Separate prayer rooms are on floor M2: M220 and M221.', ''],
      ['diet', ['food'], 'req', 'Can you cater for my dietary needs?', 'Yes. List them on your registration form; special meals are provided where the catering cannot cover them.', 'Questions go to the Access Chairs, who pass them to the events team’s food and beverage manager.'],
      ['menu', ['food'], 'pend', 'What food will be served?', 'Not announced yet. Details about the food service are still to come.', ''],
      ['present', ['pres'], 'pend', 'What support is there for presenters with access needs?', 'No answer yet — the original FAQ lists this question but does not answer it. Please email the Access Chairs.', ''],
      ['robot', ['pres'], 'no', 'Can I attend by telepresence robot?', 'No. Telepresence robots cannot be accommodated.', ''],
      ['emerg', ['health'], 'ok', 'What if I have a medical emergency?', 'Call 911 for emergency services in the US. For non-urgent care, ask any student volunteer.', 'Volunteers can also point you to nearby pharmacies and medical services. The distance to the nearest hospital is still being confirmed.'],
      ['smoke', ['health'], 'pend', 'Is the venue smoke-free?', 'Yes, the whole building is no-smoking. Outdoor smoking areas have not been announced yet.', ''],
      ['travel', ['mob', 'gen'], 'pend', 'How do I get to the venue?', 'Not published yet. Accessible transport details for the Pittsburgh venue will be added here.', '']
    ];
    var sel = this.state.sel;
    var anySel = Object.keys(sel).some(function (k) { return sel[k]; });
    var filters = FILTERS.map(function (p) {
      var on = p[0] === 'all' ? !anySel : !!sel[p[0]];
      return {
        label: p[1], pressed: on ? 'true' : 'false',
        bg: on ? '#000000' : '#F2F2F2', fg: on ? '#FFFFFF' : '#333333', border: 'transparent',
        pick: function () {
          if (p[0] === 'all') { self.setState({ sel: {} }); return; }
          var n = Object.assign({}, self.state.sel); n[p[0]] = !n[p[0]]; self.setState({ sel: n });
        }
      };
    });
    var shown = ITEMS.filter(function (it) { return !anySel || it[1].some(function (c) { return sel[c]; }); }).map(function (it) {
      var s = ST[it[2]];
      var isOpen = !!self.state.open[it[0]];
      return {
        catLabel: it[1].map(function (c) { return CAT[c]; }).join(' · '),
        statusLabel: s[0], pillBg: s[1], pillFg: s[2], pillPad: s[3], pillBorder: s[4], pillUnder: s[5],
        q: it[3], a: it[4], d: it[5],
        hasDetails: it[5] !== '', open: isOpen && it[5] !== '',
        expanded: isOpen ? 'true' : 'false',
        toggleLabel: isOpen ? 'Hide details' : 'Show details',
        toggle: function () {
          var o = Object.assign({}, self.state.open);
          o[it[0]] = !o[it[0]];
          self.setState({ open: o });
        }
      };
    });
    var G = { bg: '#F2F2F2', fg: '#000000', border: 'transparent' }, N = G, Q = G, I = G;
    function chip(l, c, room) { return { label: l, bg: c.bg, fg: c.fg, border: c.border, href: room ? '../map/?room=' + encodeURIComponent(room) : null }; }
    var floors = [
      { code: 'P2', items: [chip('Childcare area', I, 'P2 - Childcare'), chip('Nursing room', I, 'P2 - Childcare'), chip('Gender-neutral restroom', N)] },
      { code: 'M2', items: [chip('Quiet room · M219', Q, 'M2 - Room M219'), chip('Prayer rooms · M220, M221', I, 'M2 - Room M220'), chip('Rooms M211/212', N, 'M2 - Room M211/212'), chip('Gender-neutral restroom', N)] },
      { code: 'P1', items: [chip('Paper session rooms 111–134', N), chip('Gender-neutral restroom', N)] },
      { code: 'M1', items: [chip('Gender-neutral restroom', N)] },
      { code: 'P0', items: [chip('4 entrances, each with an accessible door', I), chip('Guide dog relief area · outside C & D', Q), chip('Gender-neutral restroom', N)] }
    ].map(function (fl, i, arr) { fl.line = i === arr.length - 1 ? 'transparent' : '#E5E5E5'; fl.href = '../map/?level=' + fl.code; fl.items.forEach(function (it) { it.href = it.href || fl.href; }); return fl; });
    var RS = {
      done: ['Confirmed', '#000000', '#000000'],
      review: ['In review', '#9a9a9a', '#333333'],
      wait: ['Waiting for review', '#E5E5E5', '#6b6b6b']
    };
    var requests = [['Live captions', 'done'], ['Student volunteer guide', 'review'], ['Vegetarian meals', 'wait']].map(function (r) {
      var st = RS[r[1]];
      return { label: r[0], status: st[0], bar: st[1], fg: st[2], isDone: r[1] === 'done', isReview: r[1] === 'review' };
    });
    var nDone = requests.filter(function (r) { return r.isDone; }).length;
    return {
      requests: requests,
      progressText: nDone + ' of ' + requests.length + ' confirmed',
      filters: filters,
      shown: shown,
      countLabel: shown.length + (shown.length === 1 ? ' answer' : ' answers'),
      floors: floors
    };
  }
}
</script>
<script src="../shared/dc-lite.js"></script>
</body>
</html>
