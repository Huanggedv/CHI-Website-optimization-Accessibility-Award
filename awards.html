<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CHI ’26 Awards</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<template id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5FA}
a{color:#4146C0}a:hover{color:#2F339E}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #5157D6;outline-offset:2px}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #15172A; background: #F4F5FA; min-height: 100vh">

<div style="display: flex; flex-wrap: wrap; align-items: stretch">
<aside aria-label="Conference menu" style="flex: 1 1 248px; background: #FFFFFF; border-right: 1px solid #DCDFEA; display: flex; flex-direction: column; gap: 16px; padding: 20px 12px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 12px 12px">
<div style="flex: none; width: 40px; height: 40px; background: #15172A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 13px">CHI</div>
<div><div style="font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 17px; line-height: 1.2">CHI 2026</div><div style="font-size: 13px; color: #5E6378">Barcelona · 13–17 Apr</div></div>
</div>
<nav aria-label="Conference pages" style="display: flex; flex-direction: column; gap: 12px">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7l8 7"></path><path d="M6 10v10h12V10"></path></svg>CHI 2026 Home</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Program</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14c2 .7 3 2.8 3 6"></path></svg>People</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6l6.1.9l-4.4 4.3l1 6.1L12 17l-5.4 2.9l1-6.1l-4.4-4.3l6.1-.9z"></path></svg>Recommendations</a></li>
<li><a href="awards.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: #E8EAFD; color: #4146C0; border-left: 3px solid #5157D6; font-weight: 600; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4"></path><path d="M16 6h3a3 3 0 0 1-3 4"></path><path d="M12 13v4"></path><path d="M9 20h6"></path></svg>Awards</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2l6 2l6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Maps</a></li>
<li><a href="accessibility.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="1.5"></circle><path d="M5 8l7 1.5L19 8"></path><path d="M12 9.5V14l-3 6M12 14l3 6"></path></svg>Accessibility</a></li>
</ul>
<ul style="padding-top: 12px; border-top: 1px solid #ECEEF4; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>My Schedule<span style="margin-left: auto; min-width: 24px; padding: 2px 6px; background: #5157D6; color: #FFFFFF; font-size: 12px; font-weight: 600; text-align: center">{{savedNum}}</span></a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>My Lists</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5M9 13h7M9 17h5"></path></svg>My Notes</a></li>
</ul>
<ul style="padding-top: 12px; border-top: 1px solid #ECEEF4; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><rect x="13" y="13" width="7" height="7"></rect></svg>All Conferences</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; background: transparent; color: #3D4157; border-left: 3px solid transparent; font-weight: 500; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg>About service</a></li>
</ul>
</nav>
</aside>
<div style="flex: 999 1 640px; min-width: 0">
<div style="background: #FFFFFF; border-bottom: 1px solid #DCDFEA"><div style="max-width: 1120px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px"><span style="font-size: 13px; color: #5E6378">Conference time zone · Barcelona (UTC +02:00)</span><button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: none; background: none; color: #4146C0; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Convert to my local time</button><button type="button" aria-label="Change language, current English" style="margin-left: auto; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid #DCDFEA; background: #FFFFFF; color: #3D4157; font-size: 13px; font-weight: 500; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>English · 中文 · Español</button></div></div>

<section style="max-width: 1120px; margin: 0 auto; padding: 64px 24px 72px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<h1 style="flex: 999 1 520px; min-width: 0; margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 72px; line-height: 0.92; letter-spacing: -0.045em; font-weight: 500">CHI ’26 Awards</h1>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #DCDFEA; padding: 20px 24px; display: flex; align-items: center; gap: 20px">
<div style="flex: none; width: 48px; height: 48px; background: #5157D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4"></path><path d="M16 6h3a3 3 0 0 1-3 4"></path><path d="M12 13v4"></path><path d="M9 20h6"></path></svg>
</div>
<div><h3 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">Best Paper · 62</h3><div style="font-size: 13px; color: #5E6378; margin-top: 4px">Top 1% of all paper submissions</div></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCDFEA; padding: 20px 24px; display: flex; align-items: center; gap: 20px">
<div style="flex: none; width: 48px; height: 48px; background: #E8EAFD; color: #4146C0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"></circle><path d="M9 13.5L7.5 21l4.5-2.5l4.5 2.5L15 13.5"></path></svg>
</div>
<div><h3 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">Honorable Mention · 213</h3><div style="font-size: 13px; color: #5E6378; margin-top: 4px">Top 5% of all paper submissions</div></div>
</div>
</div>
</section>

<section aria-labelledby="multi-h" style="max-width: 1120px; margin: 0 auto; padding: 0 24px 72px">
<h2 id="multi-h" style="margin: 0 0 24px; font-family: 'Inter Tight', sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">Sessions with Multiple Best Papers</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px">
<sc-for list="{{multi}}" as="m" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #DCDFEA; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #4146C0">{{m.when}}</span>
<span style="flex: none; padding: 3px 8px; background: #5157D6; color: #FFFFFF; font-size: 12px; font-weight: 500">{{m.count}} Best Papers</span>
</div>
<h3 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">{{m.session}}</h3>
<div style="font-size: 13px; color: #5E6378">{{m.room}}</div>
</div>
</sc-for>
</div>
</section>

<section aria-labelledby="list-h" style="max-width: 1120px; margin: 0 auto; padding: 0 24px 72px">
<h2 id="list-h" style="margin: 0 0 24px; font-family: 'Inter Tight', sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 500">Award Papers</h2>
<div style="background: #FFFFFF; border: 1px solid #DCDFEA; padding: 20px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px">
<div role="tablist" aria-label="Award type" style="display: flex; gap: 4px; padding: 4px; background: #ECEEF6">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: {{t.shadow}}">{{t.label}}</button>
</sc-for>
</div>
<label style="flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border: 1px solid #C5CADB; background: #FFFFFF">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6378" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search award papers</span>
<input type="search" placeholder="Search titles, authors, sessions" value="{{query}}" onChange="{{onQuery}}" style="flex: 1; min-width: 0; border: none; outline: none; font-size: 15px; color: #15172A; background: transparent">
</label>
<div role="group" aria-label="View" style="display: flex; gap: 4px; padding: 4px; background: #ECEEF6">
<sc-for list="{{views}}" as="v" hint-placeholder-count="2">
<button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="min-height: 44px; padding: 0 16px; border: none; background: {{v.bg}}; color: {{v.fg}}; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: {{v.shadow}}">{{v.label}}</button>
</sc-for>
</div>
</div>
<div role="group" aria-label="Filter by topic" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{topics}}" as="tp" hint-placeholder-count="11">
<button type="button" aria-pressed="{{tp.pressed}}" onClick="{{tp.pick}}" style="flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid {{tp.border}}; background: {{tp.bg}}; color: {{tp.fg}}; font-size: 15px; font-weight: 500; cursor: pointer">{{tp.label}} <span style="font-size: 12px; font-weight: 600; opacity: 0.75">{{tp.count}}</span></button>
</sc-for>
</div>
</div>

<sc-if value="{{isHM}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border: 1px dashed #C5CADB; padding: 40px 24px; text-align: center; color: #3D4157; font-size: 15px; line-height: 1.55">The same views apply to all 213 Honorable Mentions. This prototype shows the 62 Best Papers.</div>
</sc-if>

<sc-if value="{{showDays}}" hint-placeholder-val="{{true}}">
<div role="tablist" aria-label="Conference day" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px">
<sc-for list="{{dayTabs}}" as="d" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="flex: 1 1 150px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 18px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; cursor: pointer; text-align: left">
<span style="font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">{{d.label}}</span>
<span style="font-size: 13px; opacity: 0.8">{{d.count}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{dayEmpty}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border: 1px dashed #C5CADB; padding: 40px 24px; text-align: center; color: #3D4157; font-size: 15px">No award papers match on this day. Try another day or topic.</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 32px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="2">
<div>
<div style="display: flex; align-items: baseline; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid #C5CADB">
<h3 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500; color: #4146C0">{{s.label}}</h3>
<span style="font-size: 13px; color: #5E6378">{{s.count}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px">
<sc-for list="{{s.items}}" as="p" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #DCDFEA; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #5E6378">{{p.topicLabel}}</span>
<h4 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">{{p.title}}</h4>
<sc-if value="{{p.hasSum}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3D4157">{{p.sum}}</p>
</sc-if>
<div style="font-size: 13px; line-height: 1.5; color: #5E6378">{{p.room}} · {{p.session}}<br>{{p.authors}}</div>
<div style="margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="{{p.savedStr}}" onClick="{{p.toggle}}" style="min-height: 44px; padding: 0 14px; border: 1px solid {{p.btnBorder}}; background: {{p.btnBg}}; color: {{p.btnFg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{p.btnLabel}}</button>
<a href="{{p.doi}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid #C5CADB; color: #3D4157; font-size: 13px; font-weight: 600; text-decoration: none">Read on ACM
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></a>
</div>
</article>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showList}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{papers}}" as="p" hint-placeholder-count="8">
<article style="background: #FFFFFF; border: 1px solid #DCDFEA; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start">
<div style="flex: 0 0 120px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500; color: #4146C0">{{p.dayLabel}}</span>
<span style="font-size: 13px; color: #5E6378">{{p.timeLabel}}</span>
</div>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #5E6378">{{p.topicLabel}}</span>
<h3 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500">{{p.title}}</h3>
<sc-if value="{{p.hasSum}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3D4157">{{p.sum}}</p>
</sc-if>
<div style="font-size: 13px; line-height: 1.5; color: #5E6378">{{p.room}} · {{p.session}} · {{p.authors}}</div>
</div>
<div style="flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="{{p.savedStr}}" onClick="{{p.toggle}}" style="min-height: 44px; padding: 0 14px; border: 1px solid {{p.btnBorder}}; background: {{p.btnBg}}; color: {{p.btnFg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{p.btnLabel}}</button>
<a href="{{p.doi}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid #C5CADB; color: #3D4157; font-size: 13px; font-weight: 600; text-decoration: none">Read on ACM</a>
</div>
</article>
