<script type="text/plain" data-dc-script data-props='{"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', open: {} };
  }
  renderVals() {
    var self = this;
    var FILTERS = [
      ['all', 'Everything'], ['mob', 'Mobility'], ['hear', 'Hearing'], ['vis', 'Vision'],
      ['sens', 'Sensory & quiet'], ['food', 'Food & diet'], ['fam', 'Family & faith'],
      ['anim', 'Service animals'], ['pres', 'Presenting'], ['health', 'Health & safety']
    ];
    var CAT = { mob: 'Mobility', hear: 'Hearing', vis: 'Vision', sens: 'Sensory & quiet', food: 'Food & diet', fam: 'Family & faith', anim: 'Service animals', pres: 'Presenting', health: 'Health & safety', gen: 'General' };
    var ST = {
      ok: ['Available', '#E0F3F1', '#0F6E66'],
      req: ['Request', '#E8EAFD', '#4146C0'],
      no: ['Not offered', '#ECEDF2', '#4E5266'],
      pend: ['Pending', '#FBF0D9', '#7A5200']
    };
    var ITEMS = [
      ['wheel', ['mob'], 'ok', 'Can I get around in a wheelchair?', 'Yes. Every entrance has an accessible door, and lifts connect all five floors.', 'Lifts fit standard wheelchairs; space may be tight for large power wheelchairs or mobility scooters. In the keynote auditorium, wheelchair seating is in the lower stalls near the entrances — the upper stalls are not accessible. Auditorium seats are about 42 cm wide with fixed armrests.'],
      ['asl', ['hear'], 'req', 'Will there be sign language or live captions?', 'Yes, if you ask. ASL interpreters or captioners are booked for attendees who request them by 13 February.', 'Tick the option on your registration form. Requests after 13 February are best-effort and cannot be guaranteed.'],
      ['quiet', ['sens'], 'ok', 'Is there a quiet room?', 'Yes — Room M219 on floor M2, clearly signposted.', ''],
      ['walk', ['mob'], 'ok', 'How far will I need to walk?', 'Most walks are short. The longest is about 350 m, from the main building to the keynote auditorium.', 'Converted from the original step counts (1 step ≈ 0.7 m) — to be confirmed by the venue. Entrance → registration desk ≈ 35 m. Registration → nearest lift ≈ 35 m. Room door → stage ≈ 30 m. Each escalator has about 20 steps. Seating is available along corridors.'],
      ['vol', ['mob', 'vis'], 'req', 'Can a volunteer help me during the conference?', 'Yes. Student volunteers can help with finding your way, meal breaks and other needs. Ask for it on your registration form.', 'If you need personal care, bring your own assistant — they register for free. Email the Access Chairs for a registration code.'],
      ['loop', ['hear'], 'no', 'Is there an induction loop?', 'No. The venue has no induction loops or assistive listening devices.', 'If you need audio enhancement, contact the Access Chairs early to talk through other options.'],
      ['mic', ['hear'], 'ok', 'Will speakers use microphones?', 'Yes. Speakers and people asking questions are asked to use a microphone.', ''],
      ['light', ['sens'], 'ok', 'Will there be loud music, strobes or harsh light?', 'No loud music, strobes or spotlights are planned. Some people may find the ceiling lights uncomfortable.', 'Want more detail about the environment in advance? Mention it on your registration form or email the Access Chairs.'],
      ['scooter', ['mob'], 'req', 'Can I use a power scooter?', 'Yes — contact the Access Chairs as early as possible so they can plan for it.', ''],
      ['dog', ['anim', 'vis'], 'ok', 'Can I bring my guide dog?', 'Yes. Guide dogs and other service animals are welcome. The relief area is outside entrances C and D.', 'Let the organizers know on your registration form.'],
      ['rest', ['mob', 'fam'], 'ok', 'What are the restrooms like?', 'Every floor has at least one gender-neutral restroom, and every restroom has a wheelchair-accessible stall.', ''],
      ['child', ['fam'], 'ok', 'Is there childcare or a nursing room?', 'Yes — both are on floor P2.', ''],
      ['prayer', ['fam'], 'ok', 'Is there a prayer room?', 'Yes. Separate prayer rooms are on floor M2: M220 and M221.', ''],
      ['diet', ['food'], 'req', 'Can you cater for my dietary needs?', 'Yes. List them on your registration form; special meals are provided where the catering cannot cover them.', 'Questions go to the Access Chairs, who pass them to the events team’s food and beverage manager.'],
      ['menu', ['food'], 'pend', 'What food will be served?', 'Not announced yet. Details about the food service are still to come.', ''],
      ['present', ['pres'], 'pend', 'What support is there for presenters with access needs?', 'No answer yet — the original FAQ lists this question but does not answer it. Please email the Access Chairs.', ''],
      ['robot', ['pres'], 'no', 'Can I attend by telepresence robot?', 'No. Telepresence robots cannot be accommodated.', ''],
      ['emerg', ['health'], 'ok', 'What if I have a medical emergency?', 'Call 112 for emergency services in Spain. For non-urgent care, ask any student volunteer.', 'Volunteers can also point you to nearby pharmacies and medical services. The distance to the nearest hospital is still being confirmed.'],
      ['smoke', ['health'], 'pend', 'Is the venue smoke-free?', 'Yes, the whole building is no-smoking. Outdoor smoking areas have not been announced yet.', ''],
      ['travel', ['mob', 'gen'], 'ok', 'How do I get to the venue?', 'Taxi and public transport options are on the CCIB Access and Transport page. Barcelona City Council covers accessible public transport.', '']
    ];
    var f = this.state.filter;
    var filters = FILTERS.map(function (p) {
      var on = p[0] === f;
      return {
        label: p[1], pressed: on ? 'true' : 'false',
        bg: on ? '#5157D6' : '#FFFFFF', fg: on ? '#FFFFFF' : '#3D4157', border: on ? '#5157D6' : '#DCDFEA',
        pick: function () { self.setState({ filter: p[0] }); }
      };
    });
    var shown = ITEMS.filter(function (it) { return f === 'all' || it[1].indexOf(f) >= 0; }).map(function (it) {
      var s = ST[it[2]];
      var isOpen = !!self.state.open[it[0]];
      return {
        catLabel: it[1].map(function (c) { return CAT[c]; }).join(' · '),
        statusLabel: s[0], pillBg: s[1], pillFg: s[2],
        q: it[3], a: it[4], d: it[5],
        hasDetails: it[5] !== '', open: isOpen && it[5] !== '',
        expanded: isOpen ? 'true' : 'false',
        toggleLabel: isOpen ? 'Hide details' : 'Show details',
        toggle: function () {
          var o = Object.assign({}, self.state.open);
          o[it[0]] = !o[it[0]];
          self.setState({ open: o });
        }
      };
    });
    var N = { bg: '#F4F5FA', fg: '#3D4157', border: '#DCDFEA' }, Q = { bg: '#E0F3F1', fg: '#0F6E66', border: '#B7E0DB' }, I = { bg: '#E8EAFD', fg: '#4146C0', border: '#C9CDF7' };
    function chip(l, c) { return { label: l, bg: c.bg, fg: c.fg, border: c.border }; }
    var floors = [
      { code: 'P2', items: [chip('Childcare area', I), chip('Nursing room', I), chip('Gender-neutral restroom', N)] },
      { code: 'M2', items: [chip('Quiet room · M219', Q), chip('Prayer rooms · M220, M221', I), chip('Rooms M211/212', N), chip('Gender-neutral restroom', N)] },
      { code: 'P1', items: [chip('Paper session rooms 111–134', N), chip('Gender-neutral restroom', N)] },
      { code: 'M1', items: [chip('Gender-neutral restroom', N)] },
      { code: 'P0', items: [chip('4 entrances, each with an accessible door', I), chip('Guide dog relief area · outside C & D', Q), chip('Gender-neutral restroom', N)] }
    ].map(function (fl, i, arr) { fl.line = i === arr.length - 1 ? 'transparent' : '#ECEEF4'; return fl; });
    return {
      filters: filters,
      shown: shown,
      countLabel: shown.length + (shown.length === 1 ? ' answer' : ' answers'),
      floors: floors
    };
  }
}
</script>
